<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Echo Calculator</title>

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Echo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3B82F6">

<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="phone">
  <header class="appbar">
    <h1 id="title" data-t="title">Echo Calculator</h1>
    <div class="header-controls">
      <button class="theme-toggle wiki-btn" id="wikiBtn" type="button" aria-label="Echo Wiki">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path stroke-width="1.3" d="M2.6 6.5C4.5 5.2 6.9 5.2 8.6 6.5"></path>
          <path stroke-width="1.3" d="M15.4 6.5c1.7-1.3 4.1-1.3 6 0"></path>
          <path d="M12 7.2v13.3"></path>
          <path d="M3 18.3a1 1 0 0 1-1-1V6.1a1 1 0 0 1 1-1h4a4.7 4.7 0 0 1 4.7 4.7h.6A4.7 4.7 0 0 1 17.3 5.1h4a1 1 0 0 1 1 1v11.2a1 1 0 0 1-1 1h-5.6a3.4 3.4 0 0 0-3.4 2.9h-.6a3.4 3.4 0 0 0-3.4-2.9z"></path>
        </svg>
      </button>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
      <button class="lang-toggle" id="langToggle" type="button">HU</button>
    </div>
  </header>

  <main id="main">

    <!-- Patient Data -->
    <section class="card" data-card="patient">
      <button class="card-header" type="button" aria-expanded="false">
        <span class="title" data-t="patientData">Patient Data</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="card-body" hidden>
        <button class="bsa-toggle" type="button" id="bsaModeToggle" data-t="bsaManual">Enter BSA manually</button>

        <div id="bsaAutoFields" data-fields="weight,height"></div>

        <div id="bsaManualFields" hidden data-fields="bsaManual"></div>

        <p class="heart-rate-label" data-t="heartRateGroup">Heart Rate</p>
        <div data-fields="heartRate"></div>
      </div>
    </section>

    <!-- Mitral Valve -->
    <section class="card" data-card="mitral">
      <button class="card-header" type="button" aria-expanded="false">
        <span class="title" data-t="mitralValveGroup">Mitral Valve</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="card-body" hidden>

        <!-- MR PISA subgroup -->
        <div class="subgroup" data-subcard="mrpisa">
          <div class="head-row">
            <button class="card-header" type="button" aria-expanded="true" style="margin:0;">
              <span class="title" style="font-size:16px;" data-t="mrPisaGroup">MR PISA</span>
            </button>
            <button class="info-btn" type="button" data-info="mr" aria-label="Mitral regurgitation severity reference"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"></circle><line x1="12" y1="11" x2="12" y2="16.5"></line><circle cx="12" cy="7.8" r="0.5" fill="currentColor" stroke="none"></circle></svg></button>
            <svg class="chevron" style="width:20px;height:20px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
          <div class="field-stack sub-body" style="margin-top:12px;" data-fields="mrPisaRadius,mrAliasingVelocity,mrVmax,mrVti"></div>
        </div>

        <!-- MV VTI (PW) subgroup -->
        <div class="subgroup" data-subcard="mvvtipw">
          <div class="head-row">
            <button class="card-header" type="button" aria-expanded="true" style="margin:0;">
              <span class="title" style="font-size:16px;"><span data-t="mvVtiPw">MV VTI (PW)</span><span class="title-note" data-t="mvVtiPwNote">(for regurgitation grading)</span></span>
            </button>
            <button class="info-btn" type="button" data-info="mr" aria-label="Mitral regurgitation severity reference"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"></circle><line x1="12" y1="11" x2="12" y2="16.5"></line><circle cx="12" cy="7.8" r="0.5" fill="currentColor" stroke="none"></circle></svg></button>
            <svg class="chevron" style="width:20px;height:20px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
          <div class="field-stack sub-body" style="margin-top:12px;" data-fields="mvVtiPw"></div>
        </div>

        <!-- Mitral Stenosis subgroup -->
        <div class="subgroup" data-subcard="ms">
          <div class="head-row">
            <button class="card-header" type="button" aria-expanded="false" style="margin:0;">
              <span class="title" style="font-size:16px;" data-t="mitralStenosisGroup">Mitral Stenosis</span>
            </button>
            <button class="info-btn" type="button" data-info="ms" aria-label="Mitral stenosis severity reference"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"></circle><line x1="12" y1="11" x2="12" y2="16.5"></line><circle cx="12" cy="7.8" r="0.5" fill="currentColor" stroke="none"></circle></svg></button>
            <svg class="chevron" style="width:20px;height:20px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
          <div class="field-stack sub-body" hidden style="margin-top:12px;" data-fields="mvVtiCw,mvPht"></div>
        </div>
      </div>
    </section>

    <!-- Aortic Valve (main) -->
    <section class="card" data-card="aortic">
      <button class="card-header" type="button" aria-expanded="false">
        <span class="title" data-t="aorticValveMainGroup">Aortic Valve</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="card-body" hidden>

        <!-- LVOT subgroup -->
        <div class="subgroup" data-subcard="lvot">
          <button class="card-header" type="button" aria-expanded="true" style="margin:0;">
            <span class="title" style="font-size:16px;" data-t="lvotGroup">LVOT</span>
            <svg class="chevron" style="width:20px;height:20px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="field-stack sub-body" style="margin-top:12px;" data-fields="lvotDiam,lvotVti,lvotVmax"></div>
        </div>

        <!-- Aortic valve subgroup -->
        <div class="subgroup" data-subcard="av">
          <div class="head-row">
            <button class="card-header" type="button" aria-expanded="true" style="margin:0;">
              <span class="title" style="font-size:16px;" data-t="aorticValveGroup">Aortic Valve</span>
            </button>
            <button class="info-btn" type="button" data-info="as" aria-label="Aortic stenosis severity reference"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"></circle><line x1="12" y1="11" x2="12" y2="16.5"></line><circle cx="12" cy="7.8" r="0.5" fill="currentColor" stroke="none"></circle></svg></button>
            <svg class="chevron" style="width:20px;height:20px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
          <div class="field-stack sub-body" style="margin-top:12px;" data-fields="aorticVmax,meanGradient,aorticVti"></div>
          <div class="switch-row" style="margin-top:12px;padding:0 4px;">
            <span class="switch-label" data-t="prostheticAv"></span>
            <label class="switch">
              <input type="checkbox" id="prostheticAvToggle">
              <span class="switch-track"><span class="switch-thumb"></span></span>
            </label>
          </div>
          <div class="field-stack sub-body" hidden style="margin-top:12px;" data-fields="avAt,avEt" id="avProstheticFields"></div>
        </div>

        <!-- AR PISA subgroup -->
        <div class="subgroup" data-subcard="arpisa">
          <div class="head-row">
            <button class="card-header" type="button" aria-expanded="false" style="margin:0;">
              <span class="title" style="font-size:16px;" data-t="arPisaGroup">AR PISA</span>
            </button>
            <button class="info-btn" type="button" data-info="ar" aria-label="Aortic regurgitation severity reference"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"></circle><line x1="12" y1="11" x2="12" y2="16.5"></line><circle cx="12" cy="7.8" r="0.5" fill="currentColor" stroke="none"></circle></svg></button>
            <svg class="chevron" style="width:20px;height:20px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
          <div class="field-stack sub-body" hidden style="margin-top:12px;" data-fields="arPisaRadius,arAliasingVelocity,arVmax,arVti"></div>
        </div>
      </div>
    </section>

    <!-- Tricuspid Valve -->
    <section class="card" data-card="tricuspid">
      <button class="card-header" type="button" aria-expanded="false">
        <span class="title" data-t="tricuspidValveGroup">Tricuspid Valve</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="card-body" hidden>
        <div class="subgroup">
          <div class="subgroup-title-row">
            <p class="subgroup-title" data-t="trPisaGroup">TR PISA</p>
            <button class="info-btn" type="button" data-info="tr" aria-label="Tricuspid regurgitation severity reference"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"></circle><line x1="12" y1="11" x2="12" y2="16.5"></line><circle cx="12" cy="7.8" r="0.5" fill="currentColor" stroke="none"></circle></svg></button>
          </div>
          <div class="field-stack" data-fields="trPisaRadius,trAliasingVelocity,trVmax,trVti"></div>
        </div>
      </div>
    </section>

    <!-- Results -->
    <section class="card" id="resultsCard" hidden>
      <p class="results-title" data-t="results">Calculated Results</p>
      <div id="resultsList" style="display:flex;flex-direction:column;gap:8px;"></div>
    </section>

    <button class="clear-btn" id="clearBtn" type="button" data-t="clear">Clear All</button>
    <button class="copy-btn" id="copyBtn" type="button" data-t="copyReport">Copy to Report</button>
  </main>

  <footer class="note">Reproduction built from the app's own source (calculatorUtils.js). Not for diagnostic use.</footer>
</div>

<div class="info-overlay" id="infoOverlay" hidden role="dialog" aria-modal="true" aria-labelledby="infoTitle">
  <div class="info-panel">
    <div class="info-bar">
      <h2 id="infoTitle"></h2>
      <button class="info-close" type="button" id="infoClose" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="info-content" id="infoContent"></div>
  </div>
</div>

<div class="info-overlay" id="wikiOverlay" hidden role="dialog" aria-modal="true" aria-labelledby="wikiTitle">
  <div class="info-panel">
    <div class="info-bar">
      <button class="info-close" type="button" id="wikiBack" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <h2 id="wikiTitle"></h2>
      <button class="info-close" type="button" id="wikiClose" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="wiki-search-row" id="wikiSearchRow" hidden>
      <input type="search" id="wikiSearchInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="info-content" id="wikiContent"></div>
  </div>
</div>

<script src="./wiki-data.js"></script>
<script src="./app.js"></script>
</body>
</html>
