<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Echo Calculator</title>

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Echo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3B82F6">

<style>
  :root {
    --bg: #F5F7FA;
    --card: #FFFFFF;
    --subtle-bg: #F9FAFB;
    --input-bg: #F9FAFB;
    --input-border: #E5E7EB;
    --input-border-active: #007AFF;
    --input-border-error: #EF4444;
    --text-main: #1F2937;
    --text-sub: #6B7280;
    --text-placeholder: #9CA3AF;
    --accent: #3B82F6;
    --accent-text: #FFFFFF;
    --result-bg: #F0F9FF;
    --result-text: #1E40AF;
    --danger: #EF4444;
    --danger-text: #FFFFFF;
    --shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    --divider: #E5E7EB;
    --grade-mild-bg: #DCFCE7;
    --grade-mild-text: #166534;
    --grade-moderate-bg: #FEF3C7;
    --grade-moderate-text: #92400E;
    --grade-severe-bg: #FEE2E2;
    --grade-severe-text: #991B1B;
    --grade-extreme-bg: #7F1D1D;
    --grade-extreme-text: #FFFFFF;
    --grade-elevated-bg: #DBEAFE;
    --grade-elevated-text: #1E3A8A;
  }

  /* Light is the default and always what a fresh visit sees — dark only applies
     when the user explicitly switches via the header toggle (persisted below). */
  html[data-theme="dark"] {
    --bg: #0F1420;
    --card: #171D2B;
    --subtle-bg: #1E2536;
    --input-bg: #1B2233;
    --input-border: #2C3548;
    --input-border-active: #4C9AFF;
    --input-border-error: #F87171;
    --text-main: #E7EAF2;
    --text-sub: #93A0B8;
    --text-placeholder: #5B6784;
    --accent: #3B82F6;
    --accent-text: #FFFFFF;
    --result-bg: #16233D;
    --result-text: #7FB2FF;
    --danger: #F87171;
    --danger-text: #1A0E0E;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    --divider: #26304A;
    --grade-mild-bg: #14351F;
    --grade-mild-text: #86EFAC;
    --grade-moderate-bg: #3B2A08;
    --grade-moderate-text: #FCD34D;
    --grade-severe-bg: #3F1414;
    --grade-severe-text: #FCA5A5;
    --grade-extreme-bg: #7F1D1D;
    --grade-extreme-text: #FFE4E6;
    --grade-elevated-bg: #1E2F52;
    --grade-elevated-text: #93C5FD;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  .phone {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }

  header.appbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    /* Safe-area inset lives on the sticky header itself (not a scrolled-away
       ancestor) so its background stays full-bleed under the notch/status bar
       at every scroll position while the title/buttons stay clear of it. */
    padding: calc(16px + env(safe-area-inset-top)) 20px 16px;
    background: var(--card);
    border-bottom: 1px solid var(--divider);
    position: sticky;
    top: 0;
    z-index: 5;
  }

  header.appbar h1 {
    /* Shrinks on narrow phones where 4 header buttons + the full title no
       longer both fit at 26px — scales with viewport width instead of
       wrapping onto a second line. */
    font-size: clamp(18px, 5.4vw, 26px);
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .lang-toggle {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    touch-action: manipulation;
    user-select: none;
  }
  .lang-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .theme-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    background: var(--subtle-bg);
    border: 1px solid var(--input-border);
    border-radius: 8px;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    color: var(--text-main);
  }
  .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .theme-toggle svg { width: 20px; height: 20px; }
  .theme-toggle .icon-moon { display: none; }
  html[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
  html[data-theme="dark"] .theme-toggle .icon-moon { display: block; }
  /* ~30% wider than the other header icon buttons, per user direction */
  .wiki-btn { width: 52px; }

  main {
    flex: 1;
    padding: 20px 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 12px;
    box-shadow: var(--shadow);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
    background: none;
    border: none;
    width: 100%;
    padding: 4px 0;
    font-family: inherit;
    color: var(--text-main);
  }
  .card-header:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  .card-header .title {
    font-size: 19px;
    font-weight: 600;
  }

  .chevron {
    width: 22px;
    height: 22px;
    color: var(--text-main);
    transition: transform 0.18s ease;
    flex-shrink: 0;
  }
  .card-header[aria-expanded="true"] .chevron { transform: rotate(180deg); }
  /* In .head-row layouts the chevron sits outside the button (after the
     info button) so it can be the rightmost element — same rotation,
     driven by a sibling selector instead of a descendant one. */
  .card-header[aria-expanded="true"] ~ .chevron { transform: rotate(180deg); }

  .card-body {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card-body[hidden] { display: none; }

  .subgroup {
    background: var(--subtle-bg);
    border-radius: 12px;
    padding: 8px 8px 4px;
    border: 1px solid var(--input-border);
  }
  .subgroup + .subgroup { margin-top: 12px; }
  .subgroup-title {
    font-size: 15px;
    font-weight: 600;
    margin: 4px 4px 12px;
  }
  .subgroup .field-stack { padding: 0 4px; display: flex; flex-direction: column; gap: 12px; }
  .subgroup .field-stack[hidden] { display: none; }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-sub);
    margin-bottom: 8px;
  }

  .field input {
    width: 100%;
    background: var(--input-bg);
    border: 2px solid var(--input-border);
    border-radius: 12px;
    padding: 13px 16px;
    font-size: 17px;
    color: var(--text-main);
    font-family: inherit;
    font-variant-numeric: tabular-nums;
    transition: border-color 0.12s ease;
  }
  .field input::placeholder { color: var(--text-placeholder); }
  .field input:not(:placeholder-shown) { border-color: var(--input-border-active); }
  .field input.error { border-color: var(--input-border-error) !important; }
  .field input:focus { outline: none; border-color: var(--input-border-active); }
  .field .decimal-error {
    color: var(--danger);
    font-size: 12px;
    margin-top: 4px;
  }

  .heart-rate-label {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-sub);
    margin: 4px 0 0;
  }

  .bsa-toggle {
    background: none;
    border: none;
    color: var(--input-border-active);
    font-size: 14px;
    font-weight: 500;
    padding: 6px 0;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    touch-action: manipulation;
    user-select: none;
  }
  .bsa-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Results */
  .results-title {
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 16px;
  }
  .result-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    column-gap: 10px;
    padding: 12px 16px;
    background: var(--result-bg);
    border-radius: 8px;
  }
  .result-row .label {
    font-size: 14px;
    font-weight: 500;
    color: var(--result-text);
    min-width: 0;
  }
  .result-row .value {
    font-size: 17px;
    font-weight: 700;
    color: var(--result-text);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    text-align: right;
  }

  .clear-btn {
    background: var(--danger);
    color: var(--danger-text);
    border: none;
    padding: 16px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    margin: 4px 0 8px;
    touch-action: manipulation;
    user-select: none;
  }
  .clear-btn:focus-visible { outline: 2px solid var(--danger); outline-offset: 2px; }

  .copy-btn {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    padding: 16px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    margin: 0 0 8px;
    touch-action: manipulation;
    user-select: none;
  }
  .copy-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  footer.note {
    text-align: center;
    font-size: 12px;
    color: var(--text-sub);
    padding: 4px 20px 24px;
    line-height: 1.5;
  }

  /* Info ("i") buttons sit beside a heading. Where the heading is itself a
     collapse button, both live in .head-row so the two never nest. */
  .head-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .head-row > .card-header { flex: 1; min-width: 0; }

  .info-btn {
    flex-shrink: 0;
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    padding: 0;
    border-radius: 50%;
    border: none;
    background: none;
    color: var(--input-border-active);
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
  }
  .info-btn svg { width: 17px; height: 17px; }
  .info-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .subgroup-title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 4px 12px;
  }
  .subgroup-title-row .subgroup-title { margin: 0; }
  .head-row .info-btn { margin-left: 0; }

  /* Grade badges on results */
  .grade {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  .grade-mild, .grade-normal { background: var(--grade-mild-bg); color: var(--grade-mild-text); }
  .grade-moderate, .grade-mildlyReduced { background: var(--grade-moderate-bg); color: var(--grade-moderate-text); }
  .grade-severe, .grade-reduced { background: var(--grade-severe-bg); color: var(--grade-severe-text); }
  .grade-massive, .grade-torrential { background: var(--grade-extreme-bg); color: var(--grade-extreme-text); }
  .grade-elevated { background: var(--grade-elevated-bg); color: var(--grade-elevated-text); }

  /* Full-screen info overlay */
  .info-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .info-overlay[hidden] { display: none; }

  .info-panel {
    width: 100%;
    max-width: 430px;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  .info-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--divider);
    flex-shrink: 0;
  }
  .info-bar h2 {
    font-size: 19px;
    font-weight: 700;
    margin: 0;
    flex: 1;
    min-width: 0;
  }
  .info-close {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    background: var(--subtle-bg);
    border: 1px solid var(--input-border);
    border-radius: 8px;
    color: var(--text-main);
    cursor: pointer;
    touch-action: manipulation;
  }
  .info-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .info-close svg { width: 20px; height: 20px; }
  .info-close[hidden] { display: none; }

  .info-content {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 12px 32px;
  }

  .info-table-wrap {
    overflow-x: auto;
    background: var(--card);
    border-radius: 12px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  table.info-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  /* Tables with more columns than a phone screen can fit (e.g. TR's
     Massive/Torrential columns) use fixed column widths from a <colgroup>
     so Parameter + Mild/Moderate/Severe fit without scrolling, and only
     the trailing columns require a horizontal scroll to reach. The
     Parameter column stays pinned in place (sticky) while that happens. */
  table.info-table.wide {
    table-layout: fixed;
    border-collapse: separate;
    border-spacing: 0;
  }
  table.info-table.wide thead th {
    white-space: nowrap;
  }
  table.info-table.wide tbody th,
  table.info-table.wide tbody td {
    white-space: normal;
    overflow-wrap: break-word;
    hyphens: auto;
  }
  table.info-table.wide th:first-child,
  table.info-table.wide td:first-child {
    position: sticky;
    left: 0;
    z-index: 1;
    background: var(--card);
    box-shadow: 1px 0 0 var(--divider);
  }
  table.info-table.wide thead th:first-child { z-index: 2; }
  table.info-table.wide th,
  table.info-table.wide td {
    padding-left: 7px;
    padding-right: 7px;
  }
  table.info-table th,
  table.info-table td {
    padding: 10px 10px;
    text-align: left;
    vertical-align: top;
    border-bottom: 1px solid var(--divider);
  }
  table.info-table thead th {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-sub);
    white-space: nowrap;
  }
  table.info-table tbody th {
    font-weight: 600;
    color: var(--text-main);
  }
  table.info-table tbody td { color: var(--text-sub); font-variant-numeric: tabular-nums; }
  table.info-table tr:last-child th,
  table.info-table tr:last-child td { border-bottom: none; }
  table.info-table th.col-mild { color: var(--grade-mild-text); }
  table.info-table th.col-moderate { color: var(--grade-moderate-text); }
  table.info-table th.col-severe { color: var(--grade-severe-text); }
  table.info-table th.col-massive,
  table.info-table th.col-torrential { color: var(--grade-extreme-bg); }
  html[data-theme="dark"] table.info-table th.col-massive,
  html[data-theme="dark"] table.info-table th.col-torrential { color: var(--grade-extreme-text); }

  .info-notes {
    background: var(--card);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 16px;
  }
  .info-notes h3 {
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 10px;
  }
  .info-notes ul { margin: 0; padding-left: 18px; }
  .info-notes li {
    font-size: 13px;
    line-height: 1.55;
    color: var(--text-sub);
    margin-bottom: 8px;
  }
  .info-notes li:last-child { margin-bottom: 0; }

  /* Echo Wiki */
  .wiki-topic-list { display: flex; flex-direction: column; gap: 8px; }
  .wiki-topic-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--input-border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    color: var(--text-main);
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    text-align: left;
    width: 100%;
  }
  .wiki-topic-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wiki-topic-item svg { width: 18px; height: 18px; color: var(--text-sub); flex-shrink: 0; }
  .wiki-empty {
    color: var(--text-sub);
    font-size: 14px;
    text-align: center;
    padding: 48px 24px;
    line-height: 1.6;
  }
  .wiki-body { font-size: 15px; line-height: 1.65; color: var(--text-main); }
  .wiki-body p { margin: 0 0 14px; }
  .wiki-body p:last-child { margin-bottom: 0; }
  .wiki-body h3 { font-size: 16px; font-weight: 700; margin: 0 0 10px; }
  .wiki-body ul { margin: 0 0 14px; padding-left: 20px; }
  .wiki-body li { margin-bottom: 6px; }
  .wiki-body a { color: var(--accent); }
  .wiki-body ol { margin: 0 0 14px; padding-left: 20px; }
  .wiki-body ol > li { margin-bottom: 10px; }
  .wiki-body ol ul { margin-top: 6px; margin-bottom: 0; }
  .wiki-figure {
    margin: 4px 0 18px;
    padding: 12px 8px;
    background: var(--subtle-bg);
    border: 1px solid var(--input-border);
    border-radius: 12px;
  }
  .wiki-figure svg { display: block; width: 100%; height: auto; }
  .wiki-figure figcaption {
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-sub);
    text-align: center;
    line-height: 1.4;
  }
</style>
</head>
<body>
<div class="phone">
  <header class="appbar">
    <h1 id="title" data-t="title">Echo Calculator</h1>
    <div class="header-controls">
      <button class="theme-toggle wiki-btn" id="wikiBtn" type="button" aria-label="Echo Wiki">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path stroke-width="1.3" d="M2.6 6.5C4.5 5.2 6.9 5.2 8.6 6.5"></path>
          <path stroke-width="1.3" d="M15.4 6.5c1.7-1.3 4.1-1.3 6 0"></path>
          <path d="M12 7.2v13.3"></path>
          <path d="M3 18.3a1 1 0 0 1-1-1V6.1a1 1 0 0 1 1-1h4a4.7 4.7 0 0 1 4.7 4.7h.6A4.7 4.7 0 0 1 17.3 5.1h4a1 1 0 0 1 1 1v11.2a1 1 0 0 1-1 1h-5.6a3.4 3.4 0 0 0-3.4 2.9h-.6a3.4 3.4 0 0 0-3.4-2.9z"></path>
        </svg>
      </button>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
      <button class="lang-toggle" id="langToggle" type="button">HU</button>
    </div>
  </header>

  <main id="main">

    <!-- Patient Data -->
    <section class="card" data-card="patient">
      <button class="card-header" type="button" aria-expanded="false">
        <span class="title" data-t="patientData">Patient Data</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="card-body" hidden>
        <button class="bsa-toggle" type="button" id="bsaModeToggle" data-t="bsaManual">Enter BSA manually</button>

        <div id="bsaAutoFields">
          <div class="field">
            <label data-t-unit="weight|kg">Weight (kg)</label>
            <input type="text" inputmode="decimal" placeholder="0" data-field="weight">
            <div class="decimal-error" hidden data-t="decimalError"></div>
          </div>
          <div class="field">

    },

  // ---- exact port of calculatorUtils.js ----
  const parseNumber = (value, lang) => {
    if (!value) return NaN;
    const normalized = lang === "hu" ? value.replace(",", ".") : value;
    return parseFloat(normalized);
  };
  const calculateBSA = (weight, height, manualMode, manualValue, lang) => {
    if (manualMode) {
      const m = parseNumber(manualValue, lang);
      return !isNaN(m) && m > 0 ? m : null;
    }
    const w = parseNumber(weight, lang), h = parseNumber(height, lang);
    if (weight && height && !isNaN(w) && !isNaN(h) && w > 0 && h > 0) return Math.sqrt((h * w) / 3600);
    return null;
  };
  const calculateEro = (pisaRadius, aliasing, vmax, lang) => {
    const r = parseNumber(pisaRadius, lang), a = parseNumber(aliasing, lang), v = parseNumber(vmax, lang);
    if (pisaRadius && aliasing && vmax && !isNaN(r) && !isNaN(a) && !isNaN(v) && r > 0 && a > 0 && v > 0) {
      return (2 * Math.PI * Math.pow(r / 10, 2) * a) / (v * 100);
    }
    return null;
  };
  const calculateRegVol = (ero, vti, lang) => {
    const v = parseNumber(vti, lang);
    if (ero !== null && vti && !isNaN(v) && v > 0) return ero * v;
    return null;
  };
  const calculateSV = (lvotDiam, lvotVti, lang) => {
    const d = parseNumber(lvotDiam, lang), v = parseNumber(lvotVti, lang);
    if (lvotDiam && lvotVti && !isNaN(d) && !isNaN(v) && d > 0 && v > 0) {
      return (Math.PI * Math.pow(d / 2, 2) * v) / 100;
    }
    return null;
  };
  const calculateRegFraction = (regVol, sv) => (regVol !== null && sv !== null && sv > 0) ? (regVol / (sv + regVol)) * 100 : null;
  const calculateARRegFraction = (arRegVol, sv) => (arRegVol !== null && sv !== null && sv > 0) ? (arRegVol / sv) * 100 : null;
  const calculateSVI = (sv, bsa) => (sv !== null && bsa !== null && bsa > 0) ? sv / bsa : null;
  const calculateCardiacOutput = (sv, heartRate, lang) => {
    const hr = parseNumber(heartRate, lang);
    if (sv !== null && heartRate && !isNaN(hr) && hr > 0) return (sv / 1000) * hr;
    return null;
  };
  const calculateCardiacIndex = (co, bsa) => (co !== null && bsa !== null && bsa > 0) ? co / bsa : null;
  const calculateAVA = (lvotDiam, lvotVti, aorticVti, lang) => {
    const d = parseNumber(lvotDiam, lang), lv = parseNumber(lvotVti, lang), av = parseNumber(aorticVti, lang);
    if (lvotDiam && lvotVti && aorticVti && !isNaN(d) && !isNaN(lv) && !isNaN(av) && d > 0 && lv > 0 && av > 0) {
      return (Math.pow(d / 2, 2) * Math.PI * lv) / av / 100;
    }
    return null;
  };
  const calculateAVAI = (ava, bsa) => (ava !== null && bsa !== null && bsa > 0) ? ava / bsa : null;
  const calculateDVIVti = (lvotVti, aorticVti, lang) => {
    const lv = parseNumber(lvotVti, lang), av = parseNumber(aorticVti, lang);
    if (lvotVti && aorticVti && !isNaN(lv) && !isNaN(av) && av > 0) return lv / av;
    return null;
  };
  const calculateDVIVmax = (lvotVmax, aorticVmax, lang) => {
    const lv = parseNumber(lvotVmax, lang), av = parseNumber(aorticVmax, lang);
    if (lvotVmax && aorticVmax && !isNaN(lv) && !isNaN(av) && av > 0) return lv / av;
    return null;
  };

  // ---- severity grading ----
  // Grading bands transcribed from Echo checklist.xlsx.
  // Ambiguous range boundaries are resolved toward the higher-severity side.
  const gradeLabels = {
    en: { mild: "Mild", moderate: "Moderate", severe: "Severe", massive: "Massive", torrential: "Torrential",
      normal: "Normal", reduced: "Reduced", mildlyReduced: "Mildly reduced", elevated: "Elevated" },
    hu: { mild: "Enyhe", moderate: "Közepes", severe: "Súlyos", massive: "Masszív", torrential: "Torrentialis",
      normal: "Normális", reduced: "Csökkent", mildlyReduced: "Enyhén csökkent", elevated: "Emelkedett" },
  };
  const gradeFns = {
    mrEro: v => v < 0.2 ? "mild" : v <= 0.4 ? "moderate" : "severe",
    mrRegVol: v => v < 30 ? "mild" : v < 60 ? "moderate" : "severe",
    mrRegFraction: v => v < 30 ? "mild" : v < 50 ? "moderate" : "severe",

    avai: v => v > 0.85 ? "mild" : v > 0.6 ? "moderate" : "severe",
    dviVti: v => v > 0.5 ? "mild" : v >= 0.25 ? "moderate" : "severe",
    dviVmax: v => v > 0.5 ? "mild" : v >= 0.25 ? "moderate" : "severe",
    // Only a single cutoff is defined for this metric (per user direction):
    // below 1 reads as mild, at/above 1 reads as severe, moderate is unused.

  function renderInfo(topicKey) {
    const info = severityInfo[state.language][topicKey];
    if (!info) return;
    $("#infoTitle").textContent = info.title;
    const colClasses = ["", "col-mild", "col-moderate", "col-severe", "col-massive", "col-torrential"];
    const theadCells = info.headers.map((h, i) => {
      const cls = colClasses[i] || "";
      return `<th${cls ? ` class="${cls}"` : ""}>${h}</th>`;
    }).join("");
    const bodyRows = info.rows.map(r => {
      const [label, ...cells] = r;
      const tds = cells.map(c => {
        if (c && typeof c === "object") return `<td colspan="${c.span}">${c.text}</td>`;
        return `<td>${c}</td>`;
      }).join("");
      return `<tr><th scope="row">${label}</th>${tds}</tr>`;
    }).join("");
    const colgroup = info.colWidths
      ? `<colgroup>${info.colWidths.map(w => `<col style="width:${w}">`).join("")}</colgroup>`
      : "";
    // A fixed-layout table with width:auto still expands columns to fit
    // unbreakable content in some browsers, ignoring the colgroup — so the
    // table width has to be pinned explicitly to the sum of the columns.
    const tableWidthPx = info.colWidths
      ? info.colWidths.reduce((sum, w) => sum + parseFloat(w), 0)
      : null;
    const notesHtml = info.notes && info.notes.length
      ? `<div class="info-notes"><h3>${uiStrings[state.language].notes}</h3><ul>${info.notes.map(n => `<li>${n}</li>`).join("")}</ul></div>`
      : "";
    $("#infoContent").innerHTML = `
      <div class="info-table-wrap">
        <table class="info-table${info.wide ? " wide" : ""}"${tableWidthPx ? ` style="width:${tableWidthPx}px"` : ""}>
          ${colgroup}
          <thead><tr>${theadCells}</tr></thead>
          <tbody>${bodyRows}</tbody>
        </table>
      </div>
      ${notesHtml}
    `;
  }

          <h3>Definition &amp; pathophysiology</h3>
          <p>A chronically thickened, fibrotic — sometimes calcified — pericardium loses its elasticity and encases the heart like a rigid shell, mechanically limiting diastolic filling. Two hemodynamic hallmarks follow:</p>
          <ul>
            <li>Inspiratory drops in intrathoracic pressure don't transmit fully to the encased LA/LV, so LV filling falls with inspiration.</li>

          </ul>
          <p>Restrictive cardiomyopathy (RCM) produces a similar filling pattern, but from myocardial stiffness rather than pericardial constraint — pericardial compliance is normal, so respiratory pressure changes transmit normally. Telling the two apart matters: constriction is often surgically curable (pericardiectomy).</p>

          <h3>Echocardiographic findings in constriction</h3>
          <ul>
            <li><strong>2D/M-mode:</strong> septal bounce — an abrupt early-diastolic shift of the septum toward the LV, following the respiratory cycle (most pronounced on the first beat of inspiration); septal "shudder". Normal pericardial thickness on echo does <em>not</em> exclude constriction — TTE is unreliable for thickness; TEE, CT or MRI are better suited for that.</li>
            <li><strong>Mitral inflow:</strong> E/A &gt; 1.6, deceleration time usually &lt; 160 ms, peak E velocity falls &gt; 15–25% on the first beat of inspiration (variation is absent in up to a third of patients with constriction, and unreliable in AF).</li>
            <li><strong>Tricuspid inflow:</strong> peak E velocity rises &gt; 40% with inspiration, reciprocal to the mitral change.</li>
            <li><strong>Hepatic veins:</strong> prominent diastolic flow reversal in expiration — stays reliable even in AF.</li>
            <li><strong>Tissue Doppler (medial e′):</strong> preserved or high (≥ 8–9 cm/s) despite elevated filling pressures — the opposite of restriction. "Annulus reversus": medial e′ ≥ lateral e′, seen in up to 75% of surgically proven constriction.</li>

          <ul>

          <p>When a comprehensive TTE study is diagnostic for constriction, no further testing is usually necessary; cardiac catheterization is reserved for inconclusive or discordant cases.</p>

      const numeric = typeof val === "number" ? val : parseFloat(val);
      const formatted = fmt(numeric);
      const gradeFn = gradeFns[key];
      const grade = gradeFn ? gradeFn(numeric) : null;
      const badge = grade ? `<span class="grade grade-${grade}">${gradeLabels[lang][grade]}</span>` : "<span></span>";
      row.innerHTML = `<span class="label">${t[key]}</span>${badge}<span class="value">${formatted}${unit ? " " + unit : ""}</span>`;
      list.appendChild(row);
    });
    $("#resultsCard").hidden = !any;

    lastResults = { bsa, mrEro, mrRegVol, mrRegFraction, arEro, arRegVol, arRegFraction,
      trEro, trRegVol, sv, svi, cardiacOutput, cardiacIndex, ava, avai, dviVti, dviVmax, mvVtiLvotVti };
  }

  // ---- report text for "Copy to Report" ----
  // Raw inputs are echoed exactly as typed (no reformatting, no decimal-
  // separator conversion) — only trimmed, and only if non-empty.
  function rawInput(raw) {
    if (raw === undefined || raw === null) return null;
    const trimmed = String(raw).trim();
    return trimmed === "" ? null : trimmed;
  }

  // One PISA line: "<Group>: <label>: <val> <unit>; <label>: <val> <unit>; ..."
  // in the fixed order radius, ERO, Reg vol, Reg fraction, Vmax, VTI, Aliasing
  // velocity — regFractionLabel is omitted entirely for TR (not calculated).
  // Raw inputs (radius/Vmax/VTI/aliasing) are echoed as typed; ERO/Reg vol/Reg
  // fraction are calculated results and stay formatted via fmt().
  function pisaLine(t, groupLabel, eroLabel, regVolLabel, regFractionLabel,
                     radiusRaw, vmaxRaw, vtiRaw, aliasingRaw, eroVal, regVolVal, regFractionVal) {
    const parts = [];
    const radius = rawInput(radiusRaw);
    if (radius !== null) parts.push(`${t.pisaRadius}: ${radius} mm`);
    if (eroVal !== null) parts.push(`${eroLabel}: ${fmt(eroVal)} cm²`);
    if (regVolVal !== null) parts.push(`${regVolLabel}: ${fmt(regVolVal)} ml`);
    if (regFractionLabel && regFractionVal !== null) parts.push(`${regFractionLabel}: ${fmt(regFractionVal)} %`);
    const vmax = rawInput(vmaxRaw);
    if (vmax !== null) parts.push(`${t.vmax}: ${vmax} m/s`);
    const vti = rawInput(vtiRaw);
    if (vti !== null) parts.push(`${t.vti}: ${vti} cm`);
    const aliasing = rawInput(aliasingRaw);
    if (aliasing !== null) parts.push(`${t.aliasingVelocity}: ${aliasing} cm/s`);
    if (parts.length === 0) return null;
    return `${groupLabel}: ${parts.join("; ")}`;
  }

  function buildReportText() {
    const t = translations[state.language];
    const s = state;
    const blocks = [];

    // BSA — echoed as typed if manually entered, otherwise a calculated result
    if (lastResults.bsa !== null) {
      const bsaText = s.bsaManualMode ? rawInput(s.bsaManualValue) : fmt(lastResults.bsa);
      if (bsaText !== null) blocks.push(`${t.bsaResult}: ${bsaText} m²`);
    }

    // MR PISA
    blocks.push(pisaLine(t, t.mrPisaGroup, t.mrEro, t.mrRegVol, t.mrRegFraction,
      s.mrPisaRadius, s.mrVmax, s.mrVti, s.mrAliasingVelocity,
      lastResults.mrEro, lastResults.mrRegVol, lastResults.mrRegFraction));

    // LVOT / AV / AVA / DVI block — one line per item, no blank lines between them
    const lvotLines = [];
    const lvotDiam = rawInput(s.lvotDiam);
    if (lvotDiam !== null) lvotLines.push(`${t.lvotDiam}: ${lvotDiam} mm`);
    const lvotVti = rawInput(s.lvotVti);
    if (lvotVti !== null) lvotLines.push(`${t.lvotVti}: ${lvotVti} cm`);
    const avVti = rawInput(s.aorticVti);
    if (avVti !== null) lvotLines.push(`AV VTI: ${avVti} cm`);
    if (lastResults.ava !== null) lvotLines.push(`${t.ava}: ${fmt(lastResults.ava)} cm²`);
    if (lastResults.avai !== null) lvotLines.push(`${t.avai}: ${fmt(lastResults.avai)} cm²/m²`);
    const hasDviVti = lastResults.dviVti !== null;
    const hasDviVmax = lastResults.dviVmax !== null;
    if (hasDviVti && hasDviVmax) {
      lvotLines.push(`DVI(VTI): ${fmt(lastResults.dviVti)}; DVI(Vmax): ${fmt(lastResults.dviVmax)}`);
    } else if (hasDviVti) {
      lvotLines.push(`DVI: ${fmt(lastResults.dviVti)}`);
    } else if (hasDviVmax) {
      lvotLines.push(`DVI: ${fmt(lastResults.dviVmax)}`);
    }
    if (lastResults.svi !== null) lvotLines.push(`${t.svi}: ${fmt(lastResults.svi)} ml/m²`);
    if (lastResults.cardiacOutput !== null) lvotLines.push(`CO: ${fmt(lastResults.cardiacOutput)} l/min`);
    if (lastResults.cardiacIndex !== null) lvotLines.push(`CI: ${fmt(lastResults.cardiacIndex)} l/min/m²`);
    blocks.push(lvotLines.length ? lvotLines.join("\n") : null);

    // AR PISA
    blocks.push(pisaLine(t, t.arPisaGroup, t.arEro, t.arRegVol, t.arRegFraction,
      s.arPisaRadius, s.arVmax, s.arVti, s.arAliasingVelocity,
      lastResults.arEro, lastResults.arRegVol, lastResults.arRegFraction));

    // TR PISA — no regFraction (not calculated for TR)
    blocks.push(pisaLine(t, t.trPisaGroup, t.trEro, t.trRegVol, null,
      s.trPisaRadius, s.trVmax, s.trVti, s.trAliasingVelocity,
      lastResults.trEro, lastResults.trRegVol, null));

    return blocks.filter(b => b !== null).join("\n\n");
  }

  function flashCopyButton(message) {
    const btn = $("#copyBtn");
    btn.textContent = message;
    clearTimeout(flashCopyButton._t);
    flashCopyButton._t = setTimeout(() => applyTranslations(), 1500);
  }

  function legacyCopy(text) {
    // execCommand fallback — needed because navigator.clipboard.writeText()
    // exists but unreliably rejects with a permission error specifically
    // inside iOS standalone home-screen PWAs (a known WebKit quirk); this
    // older API works there even when the modern one doesn't.
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  $("#copyBtn").addEventListener("click", async () => {
    const t = translations[state.language];
    const text = buildReportText();
    if (!text) {
      flashCopyButton(t.copyEmpty);
      return;
    }
    let ok = false;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        await navigator.clipboard.writeText(text);
        ok = true;
      } catch (e) { /* fall through to legacy fallback below */ }
    }
    if (!ok) ok = legacyCopy(text);
    flashCopyButton(ok ? t.copied : t.copyFailed);
  });

  applyTranslations();
  computeResults();
  refreshInfoLanguage();
  refreshWikiLanguage();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body>
</html>
