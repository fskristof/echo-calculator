<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Echo Calculator</title>

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Echo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3B82F6">

<style>
  :root {
    --bg: #F5F7FA;
    --card: #FFFFFF;
    --subtle-bg: #F9FAFB;
    --input-bg: #F9FAFB;
    --input-border: #E5E7EB;
    --input-border-active: #007AFF;
    --input-border-error: #EF4444;
    --text-main: #1F2937;
    --text-sub: #6B7280;
    --text-placeholder: #9CA3AF;
    --accent: #3B82F6;
    --accent-text: #FFFFFF;
    --result-bg: #F0F9FF;
    --result-text: #1E40AF;
    --danger: #EF4444;
    --danger-text: #FFFFFF;
    --shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    --divider: #E5E7EB;
    --grade-mild-bg: #DCFCE7;
    --grade-mild-text: #166534;
    --grade-moderate-bg: #FEF3C7;
    --grade-moderate-text: #92400E;
    --grade-severe-bg: #FEE2E2;
    --grade-severe-text: #991B1B;
    --grade-extreme-bg: #7F1D1D;
    --grade-extreme-text: #FFFFFF;
    --grade-elevated-bg: #DBEAFE;
    --grade-elevated-text: #1E3A8A;
  }

  /* Light is the default and always what a fresh visit sees — dark only applies
     when the user explicitly switches via the header toggle (persisted below). */
  html[data-theme="dark"] {
    --bg: #0F1420;
    --card: #171D2B;
    --subtle-bg: #1E2536;
    --input-bg: #1B2233;
    --input-border: #2C3548;
    --input-border-active: #4C9AFF;
    --input-border-error: #F87171;
    --text-main: #E7EAF2;
    --text-sub: #93A0B8;
    --text-placeholder: #5B6784;
    --accent: #3B82F6;
    --accent-text: #FFFFFF;
    --result-bg: #16233D;
    --result-text: #7FB2FF;
    --danger: #F87171;
    --danger-text: #1A0E0E;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    --divider: #26304A;
    --grade-mild-bg: #14351F;
    --grade-mild-text: #86EFAC;
    --grade-moderate-bg: #3B2A08;
    --grade-moderate-text: #FCD34D;
    --grade-severe-bg: #3F1414;
    --grade-severe-text: #FCA5A5;
    --grade-extreme-bg: #7F1D1D;
    --grade-extreme-text: #FFE4E6;
    --grade-elevated-bg: #1E2F52;
    --grade-elevated-text: #93C5FD;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  .phone {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }

  header.appbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    /* Safe-area inset lives on the sticky header itself (not a scrolled-away
       ancestor) so its background stays full-bleed under the notch/status bar
       at every scroll position while the title/buttons stay clear of it. */
    padding: calc(16px + env(safe-area-inset-top)) 20px 16px;
    background: var(--card);
    border-bottom: 1px solid var(--divider);
    position: sticky;
    top: 0;
    z-index: 5;
  }

  header.appbar h1 {
    /* Shrinks on narrow phones where 4 header buttons + the full title no
       longer both fit at 26px — scales with viewport width instead of
       wrapping onto a second line. */
    font-size: clamp(18px, 5.4vw, 26px);
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .lang-toggle {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    touch-action: manipulation;
    user-select: none;
  }
  .lang-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .theme-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    background: var(--subtle-bg);
    border: 1px solid var(--input-border);
    border-radius: 8px;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    color: var(--text-main);
  }
  .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .theme-toggle svg { width: 20px; height: 20px; }
  .theme-toggle .icon-moon { display: none; }
  html[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
  html[data-theme="dark"] .theme-toggle .icon-moon { display: block; }
  /* ~30% wider than the other header icon buttons, per user direction */
  .wiki-btn { width: 52px; }

  main {
    flex: 1;
    padding: 20px 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 12px;
    box-shadow: var(--shadow);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
    background: none;
    border: none;
    width: 100%;
    padding: 4px 0;
    font-family: inherit;
    color: var(--text-main);
  }
  .card-header:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  .card-header .title {
    font-size: 19px;
    font-weight: 600;
  }

  .chevron {
    width: 22px;
    height: 22px;
    color: var(--text-main);
    transition: transform 0.18s ease;
    flex-shrink: 0;
  }
  .card-header[aria-expanded="true"] .chevron { transform: rotate(180deg); }
  /* In .head-row layouts the chevron sits outside the button (after the
     info button) so it can be the rightmost element — same rotation,
     driven by a sibling selector instead of a descendant one. */
  .card-header[aria-expanded="true"] ~ .chevron { transform: rotate(180deg); }

  .card-body {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card-body[hidden] { display: none; }

  .subgroup {
    background: var(--subtle-bg);
    border-radius: 12px;
    padding: 8px 8px 4px;
    border: 1px solid var(--input-border);
  }
  .subgroup + .subgroup { margin-top: 12px; }
  .subgroup-title {
    font-size: 15px;
    font-weight: 600;
    margin: 4px 4px 12px;
  }
  .subgroup .field-stack { padding: 0 4px; display: flex; flex-direction: column; gap: 12px; }
  .subgroup .field-stack[hidden] { display: none; }

  /* Label sits beside the input rather than above it, in a fixed-width
     column shared by every field — so every input box across the whole
     app lines up to the same left edge and width, regardless of how long
     an individual label is. Longer labels simply wrap to two lines. */
  .field {
    display: grid;
    grid-template-columns: 152px 1fr;
    align-items: center;
    column-gap: 10px;
  }
  .field label {
    position: relative;
    font-size: 14.5px;
    font-weight: 500;
    color: var(--text-sub);
    line-height: 1.3;
  }
  /* Taken out of flow so the grid row's vertical centering sees only the
     main label line's height — the main label text lines up with the
     input's vertical center, and "optional" just hangs below it, rather
     than the two lines centering as one block (which would push the main
     label line above the input's center). */
  .field-label-optional {
    position: absolute;
    left: 0;
    top: 100%;
    margin-top: 1px;
    font-size: 12px;
    font-weight: 400;
    color: var(--text-placeholder);
    white-space: nowrap;
  }
  .field .field-value { min-width: 0; }
  .field .field-input-wrap { position: relative; }
  .field input {
    width: 100%;
    background: var(--input-bg);
    border: 2px solid var(--input-border);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 17px;
    color: var(--text-main);
    font-family: inherit;
    font-variant-numeric: tabular-nums;
    transition: border-color 0.12s ease;
  }
  /* Reserve room on the right for the unit label so typed digits never
     run under it — kept in sync with .field-unit's own position below. */
  .field input.has-unit { padding-right: 40px; }
  .field input::placeholder { color: var(--text-placeholder); }
  .field input:not(:placeholder-shown) { border-color: var(--input-border-active); }
  .field input:focus { outline: none; border-color: var(--input-border-active); }
  /* Purely a visual overlay — doesn't affect the input's own box, so
     adding or removing a unit never shifts the input's width or alignment. */
  .field-unit {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    color: var(--text-sub);
    pointer-events: none;
    white-space: nowrap;
  }
  /* Patient Data's weight/height/BSA fields aren't wrapped in a
     .field-stack (that's reserved for subgroups), so give them the same
     row-to-row breathing room directly. :not([hidden]) keeps this from
     overriding the browser's default [hidden] { display: none } — an
     unguarded selector here would out-specificity that and defeat the
     auto/manual BSA toggle. */
  #bsaAutoFields:not([hidden]), #bsaManualFields:not([hidden]) {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .heart-rate-label {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-sub);
    margin: 4px 0 0;
  }

  .bsa-toggle {
    background: none;
    border: none;
    color: var(--input-border-active);
    font-size: 14px;
    font-weight: 500;
    padding: 6px 0;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    touch-action: manipulation;
    user-select: none;
  }
  .bsa-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Results */
  .results-title {
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 16px;
  }
  .result-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    column-gap: 10px;
    padding: 12px 16px;
    background: var(--result-bg);
    border-radius: 8px;
  }
  .result-row .label {
    font-size: 14px;
    font-weight: 500;
    color: var(--result-text);
    min-width: 0;
  }
  .result-row .value {
    font-size: 17px;
    font-weight: 700;
    color: var(--result-text);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    text-align: right;
  }

  .clear-btn {
    background: var(--danger);
    color: var(--danger-text);
    border: none;
    padding: 16px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    margin: 4px 0 8px;
    touch-action: manipulation;
    user-select: none;
  }
  .clear-btn:focus-visible { outline: 2px solid var(--danger); outline-offset: 2px; }

  .copy-btn {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    padding: 16px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    margin: 0 0 8px;
    touch-action: manipulation;
    user-select: none;
  }
  .copy-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  footer.note {
    text-align: center;
    font-size: 12px;
    color: var(--text-sub);
    padding: 4px 20px 24px;
    line-height: 1.5;
  }

  /* Info ("i") buttons sit beside a heading. Where the heading is itself a
     collapse button, both live in .head-row so the two never nest. */
  .head-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .head-row > .card-header { flex: 1; min-width: 0; }

  .info-btn {
    flex-shrink: 0;
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    padding: 0;
    border-radius: 50%;
    border: none;
    background: none;
    color: var(--input-border-active);
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
  }
  .info-btn svg { width: 17px; height: 17px; }
  .info-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .subgroup-title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 4px 12px;
  }
  .subgroup-title-row .subgroup-title { margin: 0; }
  .head-row .info-btn { margin-left: 0; }

  /* Grade badges on results */
  .grade {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  .grade-mild, .grade-normal { background: var(--grade-mild-bg); color: var(--grade-mild-text); }
  .grade-moderate, .grade-mildlyReduced { background: var(--grade-moderate-bg); color: var(--grade-moderate-text); }
  .grade-severe, .grade-reduced { background: var(--grade-severe-bg); color: var(--grade-severe-text); }
  .grade-massive, .grade-torrential { background: var(--grade-extreme-bg); color: var(--grade-extreme-text); }
  .grade-elevated { background: var(--grade-elevated-bg); color: var(--grade-elevated-text); }

  /* Full-screen info overlay */
  .info-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .info-overlay[hidden] { display: none; }

  .info-panel {
    width: 100%;
    max-width: 430px;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  .info-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--divider);
    flex-shrink: 0;
  }
  .info-bar h2 {
    font-size: 19px;
    font-weight: 700;
    margin: 0;
    flex: 1;
    min-width: 0;
  }
  .info-close {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    background: var(--subtle-bg);
    border: 1px solid var(--input-border);
    border-radius: 8px;
    color: var(--text-main);
    cursor: pointer;
    touch-action: manipulation;
  }
  .info-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .info-close svg { width: 20px; height: 20px; }
  .info-close[hidden] { display: none; }

  .info-content {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 12px 32px;
  }

  .info-table-wrap {
    overflow-x: auto;
    background: var(--card);
    border-radius: 12px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  table.info-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  /* Tables with more columns than a phone screen can fit (e.g. TR's
     Massive/Torrential columns) use fixed column widths from a <colgroup>
     so Parameter + Mild/Moderate/Severe fit without scrolling, and only
     the trailing columns require a horizontal scroll to reach. The
     Parameter column stays pinned in place (sticky) while that happens. */
  table.info-table.wide {
    table-layout: fixed;
    border-collapse: separate;
    border-spacing: 0;
  }
  table.info-table.wide thead th {
    white-space: nowrap;
  }
  table.info-table.wide tbody th,
  table.info-table.wide tbody td {
    white-space: normal;
    overflow-wrap: break-word;
    hyphens: auto;
  }
  table.info-table.wide th:first-child,
  table.info-table.wide td:first-child {
    position: sticky;
    left: 0;
    z-index: 1;
    background: var(--card);
    box-shadow: 1px 0 0 var(--divider);
  }
  table.info-table.wide thead th:first-child { z-index: 2; }
  table.info-table.wide th,
  table.info-table.wide td {
    padding-left: 7px;
    padding-right: 7px;
  }
  table.info-table th,
  table.info-table td {
    padding: 10px 10px;
    text-align: left;
    vertical-align: top;
    border-bottom: 1px solid var(--divider);
  }
  table.info-table thead th {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-sub);
    white-space: nowrap;
  }
  table.info-table tbody th {
    font-weight: 600;
    color: var(--text-main);
  }
  table.info-table tbody td { color: var(--text-sub); font-variant-numeric: tabular-nums; }
  table.info-table tr:last-child th,
  table.info-table tr:last-child td { border-bottom: none; }
  table.info-table th.col-mild { color: var(--grade-mild-text); }
  table.info-table th.col-moderate { color: var(--grade-moderate-text); }
  table.info-table th.col-severe { color: var(--grade-severe-text); }
  table.info-table th.col-massive,
  table.info-table th.col-torrential { color: var(--grade-extreme-bg); }
  html[data-theme="dark"] table.info-table th.col-massive,
  html[data-theme="dark"] table.info-table th.col-torrential { color: var(--grade-extreme-text); }

  .info-notes {
    background: var(--card);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 16px;
  }
  .info-notes h3 {
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 10px;
  }
  .info-notes ul { margin: 0; padding-left: 18px; }
  .info-notes li {
    font-size: 13px;
    line-height: 1.55;
    color: var(--text-sub);
    margin-bottom: 8px;
  }
  .info-notes li:last-child { margin-bottom: 0; }

  /* Echo Wiki */
  .wiki-topic-list { display: flex; flex-direction: column; gap: 8px; }
  .wiki-topic-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--input-border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    color: var(--text-main);
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    text-align: left;
    width: 100%;
  }
  .wiki-topic-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wiki-topic-item svg { width: 18px; height: 18px; color: var(--text-sub); flex-shrink: 0; }
  .wiki-topic-item .wiki-topic-title { flex: 1; min-width: 0; }
  .wiki-kind-chip {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 6px;
    border-radius: 5px;
    background: var(--subtle-bg);
    color: var(--text-sub);
    flex-shrink: 0;
  }
  .wiki-search-row {
    padding: 10px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--divider);
    flex-shrink: 0;
  }
  .wiki-search-row[hidden] { display: none; }
  .wiki-search-row input[type="search"] {
    width: 100%;
    background: var(--input-bg);
    border: 2px solid var(--input-border);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 15px;
    color: var(--text-main);
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
  }
  .wiki-search-row input[type="search"]::placeholder { color: var(--text-placeholder); }
  .wiki-search-row input[type="search"]:focus { outline: none; border-color: var(--input-border-active); }
  .wiki-cat {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-sub);
    margin: 18px 0 8px 4px;
  }
  .wiki-topic-list > .wiki-cat:first-child { margin-top: 0; }
  .wiki-empty {
    color: var(--text-sub);
    font-size: 14px;
    text-align: center;
    padding: 48px 24px;
    line-height: 1.6;
  }
  .wiki-body { font-size: 15px; line-height: 1.65; color: var(--text-main); }
  .wiki-body p { margin: 0 0 14px; }
  .wiki-body p:last-child { margin-bottom: 0; }
  .wiki-body h3 { font-size: 16px; font-weight: 700; margin: 0 0 10px; }
  .wiki-body ul { margin: 0 0 14px; padding-left: 20px; }
  .wiki-body li { margin-bottom: 6px; }
  .wiki-body a { color: var(--accent); }
  .wiki-body ol { margin: 0 0 14px; padding-left: 20px; }
  .wiki-body ol > li { margin-bottom: 10px; }
  .wiki-body ol ul { margin-top: 6px; margin-bottom: 0; }
  .wiki-body .info-table-wrap { margin: 4px 0 18px; }
  .wiki-figure {
    margin: 4px 0 18px;
    padding: 12px 8px;
    background: var(--subtle-bg);
    border: 1px solid var(--input-border);
    border-radius: 12px;
  }
  .wiki-figure svg { display: block; width: 100%; height: auto; }
  .wiki-figure figcaption {
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-sub);
    text-align: center;
    line-height: 1.4;
  }
  /* Photo figure with HTML text overlaid on a raster image by percentage
     position — the image itself has a fixed cream background (not theme-
     reactive), so label text uses a fixed dark color rather than
     var(--text-main), which would turn white and vanish in dark mode. */
  .anatomy-figure { position: relative; }
  .anatomy-figure img { display: block; width: 100%; height: auto; border-radius: 6px; }
  .anatomy-figure .lbl {
    position: absolute;
    transform: translate(-50%, -50%);
    color: #241b0f;
    font-weight: 700;
    text-align: center;
    line-height: 1.2;
    white-space: nowrap;
  }
  .anatomy-figure .lbl.title { font-size: 13px; }
  .anatomy-figure .lbl.chamber { font-size: 12px; }
  .anatomy-figure .lbl.small { font-size: 10.5px; white-space: normal; }
  .wiki-sources {
    margin-top: 22px;
    padding-top: 14px;
    border-top: 1px solid var(--divider);
  }
  .wiki-sources h3 { font-size: 14px; margin: 0 0 8px; color: var(--text-sub); }
  .wiki-sources ul { margin: 0 0 10px; padding-left: 18px; }
  .wiki-sources li { font-size: 13px; line-height: 1.5; color: var(--text-sub); margin-bottom: 5px; }
  .wiki-reviewed, .wiki-disclaimer { font-size: 12px; color: var(--text-sub); margin: 0 0 4px; }
  .wiki-disclaimer { font-style: italic; }
  .wiki-callout {
    margin: 0 0 14px;
    padding: 12px 14px;
    background: var(--grade-moderate-bg);
    color: var(--grade-moderate-text);
    border-radius: 10px;
    font-size: 14.5px;
    line-height: 1.55;
  }
  .wiki-callout a { color: inherit; text-decoration: underline; }
  /* Deliberately reuses the calculator's own result-row colors, so this
     reads as "the answer" in the same visual language as its output. */
  .wiki-summary {
    margin: 0 0 18px;
    padding: 12px 14px;
    background: var(--result-bg);
    color: var(--result-text);
    border-radius: 12px;
  }
  .wiki-summary h3 {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 8px;
    opacity: 0.75;
  }
  .wiki-summary ul { margin: 0; padding-left: 18px; }
  .wiki-summary li { margin-bottom: 6px; font-size: 14.5px; line-height: 1.5; }
  .wiki-summary li:last-child { margin-bottom: 0; }
</style>

  // No number in this app runs into the thousands, so a lone "." or ","
  // is unambiguously the decimal point either way — accept both regardless
  // of the active language instead of flagging one as wrong. `lang` is kept
  // in the signature for call-site compatibility but no longer used here.
  const parseNumber = (value, lang) => {
    if (!value) return NaN;
    return parseFloat(String(value).replace(",", "."));
  };
  const calculateBSA = (weight, height, manualMode, manualValue, lang) => {
    if (manualMode) {
      const m = parseNumber(manualValue, lang);
      return !isNaN(m) && m > 0 ? m : null;
    }
    const w = parseNumber(weight, lang), h = parseNumber(height, lang);
    if (weight && height && !isNaN(w) && !isNaN(h) && w > 0 && h > 0) return Math.sqrt((h * w) / 3600);
    return null;
  };
  const calculateEro = (pisaRadius, aliasing, vmax, lang) => {
    const r = parseNumber(pisaRadius, lang), a = parseNumber(aliasing, lang), v = parseNumber(vmax, lang);
    if (pisaRadius && aliasing && vmax && !isNaN(r) && !isNaN(a) && !isNaN(v) && r > 0 && a > 0 && v > 0) {
      return (2 * Math.PI * Math.pow(r / 10, 2) * a) / (v * 100);
    }
    return null;
  };
  const calculateRegVol = (ero, vti, lang) => {
    const v = parseNumber(vti, lang);
    if (ero !== null && vti && !isNaN(v) && v > 0) return ero * v;
    return null;
  };
  const calculateSV = (lvotDiam, lvotVti, lang) => {
    const d = parseNumber(lvotDiam, lang), v = parseNumber(lvotVti, lang);
    if (lvotDiam && lvotVti && !isNaN(d) && !isNaN(v) && d > 0 && v > 0) {
      return (Math.PI * Math.pow(d / 2, 2) * v) / 100;
    }
    return null;
  };
  const calculateRegFraction = (regVol, sv) => (regVol !== null && sv !== null && sv > 0) ? (regVol / (sv + regVol)) * 100 : null;

  const calculateSVI = (sv, bsa) => (sv !== null && bsa !== null && bsa > 0) ? sv / bsa : null;
  const calculateCardiacOutput = (sv, heartRate, lang) => {
    const hr = parseNumber(heartRate, lang);

  // (severityInfo) and wiki bodies, so a table written in a wiki topic
  // looks identical to the ones behind the calculator's ⓘ buttons —
  // .info-table-wrap / .info-table are global CSS, not scoped to the info
  // overlay, so this is safe to reuse anywhere in .wiki-body too.
  // spec: { headers[], rows[], colWidths?, wide? }
  // A row cell may be a plain string, or { text, span } for a colspan.
  function buildSeverityTable(spec) {
    const colClasses = ["", "col-mild", "col-moderate", "col-severe", "col-massive", "col-torrential"];
    const theadCells = spec.headers.map((h, i) => {
      const cls = colClasses[i] || "";
      return `<th${cls ? ` class="${cls}"` : ""}>${h}</th>`;
    }).join("");
    const bodyRows = spec.rows.map(r => {
      const [label, ...cells] = r;
      const tds = cells.map(c => {
        if (c && typeof c === "object") return `<td colspan="${c.span}">${c.text}</td>`;
        return `<td>${c}</td>`;
      }).join("");
      return `<tr><th scope="row">${label}</th>${tds}</tr>`;
    }).join("");
    const colgroup = spec.colWidths
      ? `<colgroup>${spec.colWidths.map(w => `<col style="width:${w}">`).join("")}</colgroup>`
      : "";
    // A fixed-layout table with width:auto still expands columns to fit
    // unbreakable content in some browsers, ignoring the colgroup — so the
    // table width has to be pinned explicitly to the sum of the columns.
    const tableWidthPx = spec.colWidths
      ? spec.colWidths.reduce((sum, w) => sum + parseFloat(w), 0)
      : null;
    return `
      <div class="info-table-wrap">
        <table class="info-table${spec.wide ? " wide" : ""}"${tableWidthPx ? ` style="width:${tableWidthPx}px"` : ""}>
          ${colgroup}
          <thead><tr>${theadCells}</tr></thead>
          <tbody>${bodyRows}</tbody>
        </table>
      </div>
    `;
  }

          <h3>Definition &amp; pathophysiology</h3>
          <p>A chronically thickened, fibrotic — sometimes calcified — pericardium loses its elasticity and encases the heart like a rigid shell, mechanically limiting diastolic filling. Two hemodynamic hallmarks follow:</p>
          <ul>
            <li>Inspiratory drops in intrathoracic pressure don't transmit fully to the encased LA/LV, so LV filling falls with inspiration.</li>
            <li>Exaggerated ventricular interdependence: as LV filling falls, RV filling rises reciprocally — this drives the respirophasic septal shift and the discordant RV/LV systolic pressures.</li>
            <li>Kussmaul's sign (an inspiratory <em>rise</em> in jugular venous pressure, instead of the normal fall) has a separate mechanism: the encased heart is already maximally filled, so it cannot accommodate the extra venous return that inspiration drives forward, and the pressure backs up into the jugular veins. This is why Kussmaul's sign is seen in constriction but not in tamponade.</li>
          </ul>
          <p>Restrictive cardiomyopathy (RCM) produces a similar filling pattern, but from myocardial stiffness rather than pericardial constraint — pericardial compliance is normal, so respiratory pressure changes transmit normally. Telling the two apart matters: constriction is often surgically curable (pericardiectomy).</p>

            <li><strong>Mitral inflow:</strong> E/A &gt; 1.6 in expiration with a deceleration time usually &lt; 160 ms — the established restrictive filling pattern. (The algorithm below enters at the more permissive E/A &gt; 0.8: that is a deliberately sensitive screening threshold, not a description of established constriction.) Peak E velocity falls &ge; 25% on the first beat of inspiration — the Mayo criterion; a looser &gt; 15% is sometimes used, at the cost of specificity. The variation is absent in up to a third of patients with constriction, and unreliable in AF.</li>

          <ul>
            <li><strong>Septum:</strong> constriction → respirophasic shift; restriction → absent.</li>
            <li><strong>Medial e′:</strong> constriction → preserved/high (≥8–9 cm/s); restriction → globally reduced.</li>
            <li><strong>Annulus reversus (medial e′ ≥ lateral e′):</strong> constriction → often present; restriction → absent.</li>
            <li><strong>Mitral inflow respiratory variation:</strong> constriction → &ge;25% fall on inspiration (&gt;15% is the looser threshold); restriction → minimal.</li>
            <li><strong>Hepatic vein expiratory diastolic reversal:</strong> constriction → prominent; restriction → minimal.</li>
            <li><strong>Longitudinal strain:</strong> constriction → preserved; restriction → reduced.</li>
            <li><strong>RV/LV systolic pressure with inspiration:</strong> constriction → discordant (opposite directions); restriction → concordant (same direction).</li>
          </ul>

          <p>When a comprehensive TTE study is diagnostic for constriction, no further testing is usually necessary; cardiac catheterization is reserved for inconclusive or discordant cases.</p>

          <h3>Common causes</h3>

          ${ventInterdependenceFigure("hu")}
          <ul>
            <li><strong>2D/M-mode:</strong> septum "bounce" — a septum hirtelen, korai diasztolés elmozdulása a bal kamra felé, a légzési ciklust követve (a belégzés első ütésében a legkifejezettebb); septalis "shudder". Adhéziók láthatók lehetnek, amik "tartják" a kamrafalat, a pericardium pedig megvastagodottnak és echodenznek tűnhet — de a normális pericardialis vastagság echoval <em>nem</em> zárja ki a constrictiót — a TTE megbízhatatlan a vastagság megítélésében, erre a TEE, CT vagy MRI alkalmasabb.</li>
            <li><strong>Mitralis beáramlás:</strong> E/A &gt; 1,6 kilégzésben, a decelerációs idő általában &lt; 160 ms — ez a kialakult restriktív telődési mintázat. (Az alábbi algoritmus a megengedőbb E/A &gt; 0,8 értéknél lép be: ez szándékosan érzékeny szűrőküszöb, nem a kialakult constrictio leírása.) A csúcs E sebesség &ge; 25%-kal csökken a belégzés első ütésében — ez a Mayo-kritérium; a lazább &gt; 15% is használatos, a specificitás rovására. A variabilitás a constrictiós betegek akár egyharmadánál hiányzik, és pitvarfibrillációban nem megbízható.</li>
            <li><strong>Tricuspidalis beáramlás:</strong> a csúcs E sebesség &gt; 40%-kal nő belégzéskor, reciprok a mitralis változással.</li>
            <li><strong>Vena hepaticák:</strong> kifejezett diasztolés reverz áramlás kilégzéskor — pitvarfibrillációban is megbízható marad.</li>
            <li><strong>Szöveti Doppler (medialis e′):</strong> megtartott vagy magas (≥ 8–9 cm/s) az emelkedett telődési nyomások ellenére — ez az ellenkezője a restrictiónak. "Annulus reversus": medialis e′ ≥ lateralis e′, a sebészileg igazolt constrictiós esetek akár 75%-ában megfigyelhető.</li>
            <li><strong>Strain:</strong> a longitudinális strain megtartott, a circumferentialis strain beszűkült — ez fordított mintázat az RCM-hez képest, ahol a longitudinális strain csökkent. Regionálisan is megfordul a gradiens: a letapadt pericardium megköti a lateralis falat, így a lateralis longitudinális strain csökken, miközben a septalis megtartott marad.</li>
            <li><strong>V. cava inferior:</strong> tágult, &lt;50%-os collapsus szimatolásra (sniff) — emelkedett jobb pitvari nyomást tükröz, de nem specifikus constrictióra.</li>
          </ul>
          <p class="wiki-callout"><strong>Fontos! – "annulus reversus":</strong> mivel az annulus mozgása fokozott a magas telődési nyomások ellenére, az E/e′ hányados nem használható a bal kamrai telődési nyomás becslésére feltételezett constrictio esetén.</p>

          <h3>Constrictio vs. restrictio — gyors összehasonlítás</h3>
          <ul>
            <li><strong>Septum:</strong> constrictio → légzésfüggő elmozdulás; restrictio → hiányzik.</li>
            <li><strong>Medialis e′:</strong> constrictio → megtartott/magas (≥8–9 cm/s); restrictio → globálisan csökkent.</li>
            <li><strong>Annulus reversus (medialis e′ ≥ lateralis e′):</strong> constrictio → gyakran jelen van; restrictio → hiányzik.</li>
            <li><strong>Mitralis beáramlás légzési variabilitása:</strong> constrictio → &ge;25%-os csökkenés belégzéskor (&gt;15% a lazább küszöb); restrictio → minimális.</li>
            <li><strong>Vena hepatica kilégzési diasztolés reverz áramlás:</strong> constrictio → kifejezett; restrictio → minimális.</li>
            <li><strong>Longitudinális strain:</strong> constrictio → megtartott; restrictio → csökkent.</li>
            <li><strong>Jobb/bal kamrai szisztolés nyomás belégzéskor:</strong> constrictio → diszkordáns (ellentétes irányú); restrictio → konkordáns (azonos irányú).</li>
          </ul>

          <h3>Diagnosztikus algoritmus (ESC/EACVI echo algoritmus)</h3>
          ${cpAlgorithmFigure("hu")}
          <p><strong>Restrictiót valószínűsítő jelek</strong> (ha restriktív komponens gyanúja továbbra is fennáll): DT &lt; 150 ms, IVRT &lt; 50 ms, pulmonalis vénás szisztolés frakció &lt; 40%, E/e′ &gt; 15, LAVI &gt; 48 ml/m².</p>
          <p>Ha egy átfogó TTE vizsgálat diagnosztikus constrictióra, további vizsgálat általában nem szükséges; a szívkatéterezés a nem egyértelmű vagy ellentmondó esetek számára van fenntartva.</p>

          <h3>Gyakori okok</h3>
          <p>A leggyakoribb etiológiák: szívműtét utáni állapot, korábbi sugárkezelés, tuberkulózis, valamint recidiváló/virális pericarditis. A sugárkezelés utáni esetek gyakran kevert constrictiv/restriktiv mintázatot mutatnak.</p>

          <h3>Buktatók</h3>
          <ul>
            <li>A COPD utánozhatja a constrictio légzésfüggő beáramlási variabilitását, de alacsonyabb E/A hányadossal, hosszabb decelerációs idővel és kifejezett belégzési előremenő áramlással jár a vena cava superiorban (ami constrictióban hiányzik).</li>
            <li>Pitvarfibrillációban a mitralis beáramlás variabilitása nem megbízható — ilyenkor a medialis e′-re és a vena hepatica jelekre érdemes támaszkodni.</li>
            <li>A normális pericardialis vastagság képalkotáson nem zárja ki a constrictiót.</li>
          </ul>
        `,
      },
      sources: [
        {
          url: "https://www.cardioserv.net/constrictive-pericarditis-vs-restrictive-cardiomyopathy-echo-findings/",
          label: { en: "Cardioserv — Constrictive Pericarditis vs Restrictive Cardiomyopathy", hu: "Cardioserv — Constrictive Pericarditis vs Restrictive Cardiomyopathy" },
        },
        {
          url: "https://www.escardio.org/communities/councils/cardiology-practice/scientific-documents-and-publications/ejournal/volume-15/Constrictive-pericarditis-role-of-echocardiography-and-magnetic-resonance-imaging/",
          label: { en: "ESC e-Journal — Constrictive pericarditis: role of echocardiography and MRI", hu: "ESC e-Journal — Constrictive pericarditis: role of echocardiography and MRI" },
        },
        {
          label: { en: "EACVI Imaging Summer School, Graz 2026 (slide reference)", hu: "EACVI Imaging Summer School, Graz 2026 (dia hivatkozás)" },

    },
  ];

  // Dev guard: a topic's EN and HU bodies should contain the same numbers. A
  // mismatch almost always means a cutoff was corrected in one language only
  // — the single largest maintenance risk here, since every cutoff exists
  // twice, in two long strings, with nothing else to catch a missed pair.
  // HU decimal commas are normalised to dots first. SVG coordinates appear
  // in both bodies identically, so they cancel out. Console-only, dev-gated
  // — never runs for production users.
  // Dev guard: EN/HU should carry the same numbers, and a summary's two
  // language arrays should have the same line count. A mismatch almost
  // always means one language got edited and the other didn't — the single
  // largest maintenance risk here, since every fact exists twice. Topics
  // lacking a body (cards) or a summary are skipped for that respective
  // check rather than erroring; a topic with *one* language present and the
  // other missing is a genuine contract violation and is left to throw
  // loudly instead of being silently swallowed.
  function auditWikiTopics() {
    const tokens = (html) => (html
      .replace(/<[^>]*>/g, " ")
      .replace(/(\d),(\d)/g, "$1.$2")
      .match(/\d+(?:\.\d+)?/g) || []).sort().join(" ");
    wikiTopics.forEach(t => {
      if (t.body) {
        const en = tokens(t.body.en), hu = tokens(t.body.hu);
        if (en !== hu) {
          console.warn(`[wiki] numeric drift in "${t.id}"\n  en: ${en}\n  hu: ${hu}`);
        }
      }
      if (t.summary) {
        const enLen = t.summary.en.length, huLen = t.summary.hu.length;
        if (enLen !== huLen) {
          console.warn(`[wiki] summary line-count mismatch in "${t.id}": en=${enLen} hu=${huLen}`);
        }
      }
    });
  }
  if (location.hostname === "localhost" ||
      location.hostname === "127.0.0.1" ||
      location.search.includes("audit")) {
    auditWikiTopics();
  }

  let currentWikiTopic = null;
  let wikiSearchQuery = "";
  // Accent- and case-insensitive fold, e.g. "billentyu" matches "Billentyűk".
  // Hungarian ő/ű decompose under NFD to a base letter + U+030B (COMBINING
  // DOUBLE ACUTE ACCENT), which falls inside the combining-marks range
  // stripped below, so double acutes fold correctly along with plain
  // accents.
  const foldWikiText = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

  function wikiTopicMatchesQuery(topic, foldedQuery) {
    const lang = state.language;
    if (foldWikiText(topic.title[lang]).includes(foldedQuery)) return true;
    const kw = topic.keywords && topic.keywords[lang];
    if (kw && kw.some(k => foldWikiText(k).includes(foldedQuery))) return true;
    const summary = topic.summary && topic.summary[lang];
    if (summary && summary.some(line => foldWikiText(line).includes(foldedQuery))) return true;
    // Body is raw HTML — strip tags before folding so markup never
    // accidentally matches (or blocks) a query.
    const body = topic.body && topic.body[lang];
    if (body && foldWikiText(body.replace(/<[^>]*>/g, " ")).includes(foldedQuery)) return true;
    return false;
  }

  function renderWikiTopicButton(topic) {
    const chip = topic.kind === "card"
      ? `<span class="wiki-kind-chip">${uiStrings[state.language].card}</span>`
      : "";
    return `
      <button class="wiki-topic-item" type="button" data-wiki-topic="${topic.id}">
        <span class="wiki-topic-title">${topic.title[state.language]}</span>
        ${chip}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>
      </button>
    `;
  }

  function renderWikiList() {
    $("#wikiTitle").textContent = translations[state.language].wikiTitle;
    $("#wikiSearchRow").hidden = false;
    if (wikiTopics.length === 0) {
      $("#wikiContent").innerHTML = `<div class="wiki-empty">${translations[state.language].wikiEmpty}</div>`;
      $("#wikiContent").scrollTop = 0;
      return;
    }
    const query = wikiSearchQuery.trim();
    if (query) {
      // A targeted lookup wants a flat list, not browsing — drop the
      // category headings while a query is active.
      const folded = foldWikiText(query);
      const matches = wikiTopics.filter(t => wikiTopicMatchesQuery(t, folded));
      $("#wikiContent").innerHTML = matches.length
        ? `<div class="wiki-topic-list">${matches.map(renderWikiTopicButton).join("")}</div>`
        : `<div class="wiki-empty">${uiStrings[state.language].noResults}</div>`;
      $$("[data-wiki-topic]", $("#wikiContent")).forEach(btn => {
        btn.addEventListener("click", () => openWikiTopic(btn.dataset.wikiTopic));
      });
      $("#wikiContent").scrollTop = 0;
      return;
    }
    // Group by category (in wikiCategories order); unknown/missing category
    // falls into "other". Skip the heading entirely when only one category
    // is actually populated — a single topic shouldn't sprout a lone header.
    const byCategory = new Map(wikiCategories.map(c => [c.id, []]));
    wikiTopics.forEach(topic => {
      const key = byCategory.has(topic.category) ? topic.category : "other";
      byCategory.get(key).push(topic);
    });
    const populated = wikiCategories.filter(c => byCategory.get(c.id).length > 0);
    const showHeadings = populated.length > 1;
    $("#wikiContent").innerHTML = `
      <div class="wiki-topic-list">
        ${populated.map(cat => `
          ${showHeadings ? `<h3 class="wiki-cat">${cat.label[state.language]}</h3>` : ""}
          ${byCategory.get(cat.id).map(renderWikiTopicButton).join("")}
        `).join("")}
      </div>
    `;
    $$("[data-wiki-topic]", $("#wikiContent")).forEach(btn => {
      btn.addEventListener("click", () => openWikiTopic(btn.dataset.wikiTopic));
    });
    $("#wikiContent").scrollTop = 0;
  }

  function renderWikiSummary(topic, lang) {
    if (!topic.summary || !topic.summary[lang] || !topic.summary[lang].length) return "";
    const items = topic.summary[lang].map(line => `<li>${line}</li>`).join("");
    return `
      <div class="wiki-summary">
        <h3>${uiStrings[lang].atMachine}</h3>
        <ul>${items}</ul>
      </div>`;
  }

  function renderWikiSources(topic, lang) {
    if (!topic.sources || !topic.sources.length) return "";
    const items = topic.sources.map(s => {
      const label = s.label[lang];
      return s.url
        ? `<li><a href="${s.url}" target="_blank" rel="noopener">${label}</a></li>`
        : `<li>${label}</li>`;
    }).join("");
    const reviewed = topic.reviewed
      ? `<p class="wiki-reviewed">${uiStrings[lang].reviewed}: ${topic.reviewed}</p>`
      : "";
    return `
      <div class="wiki-sources">
        <h3>${uiStrings[lang].sources}</h3>
        <ul>${items}</ul>
        ${reviewed}
        <p class="wiki-disclaimer">${uiStrings[lang].disclaimer}</p>
      </div>`;
  }

  function renderWikiTopic(id) {
    const topic = wikiTopics.find(t => t.id === id);
    if (!topic) { renderWikiList(); return; }
    const lang = state.language;
    $("#wikiTitle").textContent = topic.title[lang];
    $("#wikiSearchRow").hidden = true;
    const summaryHtml = renderWikiSummary(topic, lang);
    const tableHtml = topic.table ? buildSeverityTable(topic.table) : "";
    // Cards omit `body` entirely — guard the access rather than assume it.
    const bodyHtml = (topic.kind !== "card" && topic.body)
      ? `<div class="wiki-body">${topic.body[lang]}</div>`
      : "";
    $("#wikiContent").innerHTML = `${summaryHtml}${tableHtml}${bodyHtml}${renderWikiSources(topic, lang)}`;
    $("#wikiContent").scrollTop = 0;
  }

  // ---- wiki routing ----
  // #wiki = topic list, #wiki/<id> = topic, no hash = closed. All view
  // changes go through the URL so the phone/browser back gesture steps
  // topic -> list -> closed instead of leaving the PWA entirely.
  // history.state.wikiDepth tracks how many entries we've pushed, so the
  // in-app back button can use a real history.back() when there's
  // something of ours to go back to, and fall back to replaceState when
  // the user arrived on a deep link (no "list" entry beneath them yet).
  function parseWikiHash() {
    const h = location.hash;
    if (h === "#wiki") return { open: true, topic: null };
    const m = /^#wiki\/(.+)$/.exec(h);
    if (m && wikiTopics.some(t => t.id === decodeURIComponent(m[1]))) {
      return { open: true, topic: decodeURIComponent(m[1]) };
    }
    return { open: false, topic: null };
  }

  // Single source of truth: render whatever the current URL says.
  function syncWikiToHash() {
    const route = parseWikiHash();
    const overlay = $("#wikiOverlay");
    if (!route.open) {
      if (!overlay.hidden) teardownOverlay();
      currentWikiTopic = null;
      overlay.hidden = true;
      clearWikiSearch();
      return;
    }
    const wasHidden = overlay.hidden;
    currentWikiTopic = route.topic;
    if (route.topic) renderWikiTopic(route.topic); else renderWikiList();
    overlay.hidden = false;
    if (wasHidden) setupOverlay($("#wikiBack"));
  }

  function goWiki(hash, { replace = false } = {}) {
    const depth = (history.state && history.state.wikiDepth) || 0;
    const url = hash || location.pathname + location.search;
    const nextState = { wikiDepth: replace ? depth : depth + 1 };
    if (replace) history.replaceState(nextState, "", url);
    else history.pushState(nextState, "", url);
    syncWikiToHash();
  }

  // Search is view state, not a route — it's reset (not persisted) across
  // opens, closes, and language switches, and never pushes history.
  function clearWikiSearch() {
    wikiSearchQuery = "";
    $("#wikiSearchInput").value = "";
  }

  function openWiki()        { clearWikiSearch(); goWiki("#wiki"); }
  function openWikiTopic(id) { goWiki(`#wiki/${encodeURIComponent(id)}`); }
  // The back button is always visible (list page included). From a topic
  // it goes back to the list; from the list itself there's nowhere
  // further "back" to go, so it just closes the wiki — same as the X.
  function backToWikiList() {
    if ((history.state && history.state.wikiDepth) > 1) history.back();
    else goWiki("#wiki", { replace: true });
  }
  function closeWiki()      { goWiki(null); }
  function handleWikiBack() { currentWikiTopic ? backToWikiList() : closeWiki(); }

  window.addEventListener("popstate", syncWikiToHash);
  function refreshWikiLanguage() {
    $("#wikiBack").setAttribute("aria-label", uiStrings[state.language].back);
    $("#wikiClose").setAttribute("aria-label", uiStrings[state.language].close);
    $("#wikiBtn").setAttribute("aria-label", translations[state.language].wikiTitle);
    $("#wikiSearchInput").placeholder = uiStrings[state.language].searchPlaceholder;
    clearWikiSearch();
    if (!$("#wikiOverlay").hidden) {
      if (currentWikiTopic) renderWikiTopic(currentWikiTopic);
      else renderWikiList();
    }
  }

  // ---- state ----
  const state = { language: "hu", bsaManualMode: false };
  // Snapshot of the last computeResults() output, kept for the "Copy to Report"
  // feature so it doesn't need to recompute everything itself.
  let lastResults = {};
  const fieldNames = [
    "weight","height","bsaManual","heartRate",
    "mrPisaRadius","mrAliasingVelocity","mrVmax","mrVti","mvVtiPw",
    "arPisaRadius","arAliasingVelocity","arVmax","arVti",
    "trPisaRadius","trAliasingVelocity","trVmax","trVti",
    "lvotDiam","lvotVti","lvotVmax","aorticVmax","meanGradient","aorticVti"
  ];
  fieldNames.forEach(f => state[f] = "");

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  // ---- theme (light is always the default for a first visit; a manual
  // choice is remembered locally so it persists between launches) ----
  let theme = "light";
  try {
    if (localStorage.getItem("echo-theme") === "dark") theme = "dark";
  } catch (e) { /* localStorage unavailable (e.g. private mode) — fall back to light */ }

  function applyTheme() {
    if (theme === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
  }
  applyTheme();

  function applyTranslations() {
    const t = translations[state.language];
    document.documentElement.lang = state.language;
    $$("[data-t]").forEach(el => {
      const key = el.getAttribute("data-t");
      if (t[key] !== undefined) el.textContent = t[key];
    });
    $("#bsaModeToggle").textContent = state.bsaManualMode ? t.bsaCalculate : t.bsaManual;
    $("#langToggle").textContent = state.language === "en" ? "HU" : "EN";
    document.title = t.title;
  }

  $$("input[data-field]").forEach(input => {
    input.addEventListener("input", () => {
      const key = input.dataset.field === "bsaManual" ? "bsaManualValue" : input.dataset.field;
      state[key] = input.value;
      computeResults();
    });
  });

  $$(".card-header").forEach(btn => {
    btn.addEventListener("click", () => {
      const expanded = btn.getAttribute("aria-expanded") === "true";
      btn.setAttribute("aria-expanded", String(!expanded));
      // In a .head-row layout the button's sibling is the info button, not
      // the collapsible body — the body follows the whole .head-row instead.
      const body = (btn.closest(".head-row") || btn).nextElementSibling;
      body.hidden = expanded;
    });
  });
  // Standalone chevrons (moved outside the button in .head-row layouts so
  // the info button can sit between the title and the chevron) still need
  // to trigger the same collapse toggle when clicked directly.
  $$(".head-row > svg.chevron").forEach(chevron => {
    chevron.addEventListener("click", () => {
      chevron.closest(".head-row").querySelector(".card-header").click();
    });
  });

  $("#bsaModeToggle").addEventListener("click", () => {
    state.bsaManualMode = !state.bsaManualMode;
    $("#bsaAutoFields").hidden = state.bsaManualMode;
    $("#bsaManualFields").hidden = !state.bsaManualMode;
    applyTranslations();
    computeResults();
  });

  $("#langToggle").addEventListener("click", () => {
    state.language = state.language === "en" ? "hu" : "en";
    applyTranslations();
    computeResults();
    refreshInfoLanguage();
    refreshWikiLanguage();
  });

  $("#themeToggle").addEventListener("click", () => {
    theme = theme === "dark" ? "light" : "dark";
    applyTheme();
    try { localStorage.setItem("echo-theme", theme); } catch (e) { /* ignore */ }
  });

  $$(".info-btn").forEach(btn => {
    btn.addEventListener("click", () => openInfo(btn.dataset.info));
  });
  $("#infoClose").addEventListener("click", closeInfo);

  $("#wikiBtn").addEventListener("click", openWiki);
  $("#wikiClose").addEventListener("click", closeWiki);
  $("#wikiBack").addEventListener("click", handleWikiBack);
  $("#wikiSearchInput").addEventListener("input", (e) => {
    wikiSearchQuery = e.target.value;
    renderWikiList();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!$("#infoOverlay").hidden) closeInfo();
    // Escape steps back (topic -> list -> closed), same as the on-screen
    // back button, instead of closing the wiki outright from a topic.
    if (!$("#wikiOverlay").hidden) handleWikiBack();
  });

  $("#clearBtn").addEventListener("click", () => {
    fieldNames.forEach(f => state[f] = "");
    state.bsaManualValue = "";
    $$("input[data-field]").forEach(i => { i.value = ""; });
    computeResults();
  });

  function fmt(value) {
    if (value === null || value === undefined || isNaN(value)) return null;
    return state.language === "hu" ? value.toFixed(2).replace(".", ",") : value.toFixed(2);
  }

  function computeResults() {
    const s = state, lang = s.language;
    const bsa = calculateBSA(s.weight, s.height, s.bsaManualMode, s.bsaManualValue, lang);
    const mrEro = calculateEro(s.mrPisaRadius, s.mrAliasingVelocity, s.mrVmax, lang);
    const mrRegVol = calculateRegVol(mrEro, s.mrVti, lang);
    const sv = calculateSV(s.lvotDiam, s.lvotVti, lang);
    const mrRegFraction = calculateRegFraction(mrRegVol, sv);
    const arEro = calculateEro(s.arPisaRadius, s.arAliasingVelocity, s.arVmax, lang);
    const arRegVol = calculateRegVol(arEro, s.arVti, lang);
    const arRegFraction = calculateARRegFraction(arRegVol, sv);
    const trEro = calculateEro(s.trPisaRadius, s.trAliasingVelocity, s.trVmax, lang);
    const trRegVol = calculateRegVol(trEro, s.trVti, lang);
    const svi = calculateSVI(sv, bsa);
    const cardiacOutput = calculateCardiacOutput(sv, s.heartRate, lang);
    const cardiacIndex = calculateCardiacIndex(cardiacOutput, bsa);
    const ava = calculateAVA(s.lvotDiam, s.lvotVti, s.aorticVti, lang);
    const avai = calculateAVAI(ava, bsa);
    const dviVti = calculateDVIVti(s.lvotVti, s.aorticVti, lang);
    const dviVmax = calculateDVIVmax(s.lvotVmax, s.aorticVmax, lang);
    let mvVtiLvotVti = null;
    if (s.mvVtiPw && s.lvotVti) {
      const r = parseFloat(s.mvVtiPw) / parseFloat(s.lvotVti);
      if (!isNaN(r)) mvVtiLvotVti = r.toFixed(2);
    }

    const t = translations[lang];
    const rows = [
      ["bsaResult", bsa, "m²"],
      ["mrEro", mrEro, "cm²"],
      ["mrRegVol", mrRegVol, "ml"],
      ["mrRegFraction", mrRegFraction, "%"],
      ["arEro", arEro, "cm²"],
      ["arRegVol", arRegVol, "ml"],
      ["arRegFraction", arRegFraction, "%"],
      ["trEro", trEro, "cm²"],
      ["trRegVol", trRegVol, "ml"],
      ["ava", ava, "cm²"],
      ["avai", avai, "cm²/m²"],
      ["dviVti", dviVti, ""],
      ["dviVmax", dviVmax, ""],
      ["mvVtiLvotVti", mvVtiLvotVti === null ? null : parseFloat(mvVtiLvotVti.replace(",", ".")), ""],
      ["sv", sv, "ml"],
      ["svi", svi, "ml/m²"],
      ["cardiacOutput", cardiacOutput, "l/min"],
      ["cardiacIndex", cardiacIndex, "l/min/m²"],
    ];

    const list = $("#resultsList");
    list.innerHTML = "";
    let any = false;
    rows.forEach(([key, val, unit]) => {
      if (val === null || val === undefined || (typeof val === "number" && isNaN(val))) return;
      any = true;
      const row = document.createElement("div");
      row.className = "result-row";
      const numeric = typeof val === "number" ? val : parseFloat(val);
      const formatted = fmt(numeric);
      const gradeFn = gradeFns[key];
      const grade = gradeFn ? gradeFn(numeric) : null;
      const badge = grade ? `<span class="grade grade-${grade}">${gradeLabels[lang][grade]}</span>` : "<span></span>";
      row.innerHTML = `<span class="label">${t[key]}</span>${badge}<span class="value">${formatted}${unit ? " " + unit : ""}</span>`;
      list.appendChild(row);
    });
    $("#resultsCard").hidden = !any;

    lastResults = { bsa, mrEro, mrRegVol, mrRegFraction, arEro, arRegVol, arRegFraction,
      trEro, trRegVol, sv, svi, cardiacOutput, cardiacIndex, ava, avai, dviVti, dviVmax, mvVtiLvotVti };
  }

  // ---- report text for "Copy to Report" ----
  // Raw inputs are echoed as typed, trimmed, and only if non-empty — but
  // the decimal separator is normalized to match the active language
  // (a user can type either "." or "," in the fields; input parsing
  // already accepts both), so a report copied in HU always reads with
  // commas and one copied in EN always reads with dots, regardless of
  // which separator was actually typed into each field.
  function rawInput(raw, lang) {
    if (raw === undefined || raw === null) return null;
    const trimmed = String(raw).trim();
    if (trimmed === "") return null;
    const targetSep = lang === "hu" ? "," : ".";
    return trimmed.replace(/[.,]/, targetSep);
  }

  // One PISA line: "<Group>: <label>: <val> <unit>; <label>: <val> <unit>; ..."
  // in the fixed order radius, ERO, Reg vol, Reg fraction, Vmax, VTI, Aliasing
  // velocity — regFractionLabel is omitted entirely for TR (not calculated).
  // Raw inputs (radius/Vmax/VTI/aliasing) are echoed as typed (decimal
  // separator normalized to lang); ERO/Reg vol/Reg fraction are calculated
  // results and stay formatted via fmt().
  function pisaLine(t, lang, groupLabel, eroLabel, regVolLabel, regFractionLabel,
                     radiusRaw, vmaxRaw, vtiRaw, aliasingRaw, eroVal, regVolVal, regFractionVal) {
    const parts = [];
    const radius = rawInput(radiusRaw, lang);
    if (radius !== null) parts.push(`${t.pisaRadius}: ${radius} mm`);
    if (eroVal !== null) parts.push(`${eroLabel}: ${fmt(eroVal)} cm²`);
    if (regVolVal !== null) parts.push(`${regVolLabel}: ${fmt(regVolVal)} ml`);
    if (regFractionLabel && regFractionVal !== null) parts.push(`${regFractionLabel}: ${fmt(regFractionVal)} %`);
    const vmax = rawInput(vmaxRaw, lang);
    if (vmax !== null) parts.push(`${t.vmax}: ${vmax} m/s`);
    const vti = rawInput(vtiRaw, lang);
    if (vti !== null) parts.push(`${t.vti}: ${vti} cm`);
    const aliasing = rawInput(aliasingRaw, lang);
    if (aliasing !== null) parts.push(`${t.aliasingVelocity}: ${aliasing} cm/s`);
    if (parts.length === 0) return null;
    return `${groupLabel}: ${parts.join("; ")}`;
  }

  function buildReportText() {
    const lang = state.language;
    const t = translations[lang];
    const s = state;
    const blocks = [];

    // BSA — echoed as typed if manually entered, otherwise a calculated result
    if (lastResults.bsa !== null) {
      const bsaText = s.bsaManualMode ? rawInput(s.bsaManualValue, lang) : fmt(lastResults.bsa);
      if (bsaText !== null) blocks.push(`${t.bsaResult}: ${bsaText} m²`);
    }

    // MR PISA
    blocks.push(pisaLine(t, lang, t.mrPisaGroup, t.mrEro, t.mrRegVol, t.mrRegFraction,
      s.mrPisaRadius, s.mrVmax, s.mrVti, s.mrAliasingVelocity,
      lastResults.mrEro, lastResults.mrRegVol, lastResults.mrRegFraction));

    // LVOT / AV / AVA / DVI block — one line per item, no blank lines between them
    const lvotLines = [];
    const lvotDiam = rawInput(s.lvotDiam, lang);
    if (lvotDiam !== null) lvotLines.push(`${t.lvotDiam}: ${lvotDiam} mm`);
    const lvotVti = rawInput(s.lvotVti, lang);
    if (lvotVti !== null) lvotLines.push(`${t.lvotVti}: ${lvotVti} cm`);
    const avVti = rawInput(s.aorticVti, lang);
    if (avVti !== null) lvotLines.push(`AV VTI: ${avVti} cm`);
    if (lastResults.ava !== null) lvotLines.push(`${t.ava}: ${fmt(lastResults.ava)} cm²`);
    if (lastResults.avai !== null) lvotLines.push(`${t.avai}: ${fmt(lastResults.avai)} cm²/m²`);
    const hasDviVti = lastResults.dviVti !== null;
    const hasDviVmax = lastResults.dviVmax !== null;
    if (hasDviVti && hasDviVmax) {
      lvotLines.push(`DVI(VTI): ${fmt(lastResults.dviVti)}; DVI(Vmax): ${fmt(lastResults.dviVmax)}`);
    } else if (hasDviVti) {
      lvotLines.push(`DVI: ${fmt(lastResults.dviVti)}`);
    } else if (hasDviVmax) {
      lvotLines.push(`DVI: ${fmt(lastResults.dviVmax)}`);
    }
    if (lastResults.svi !== null) lvotLines.push(`${t.svi}: ${fmt(lastResults.svi)} ml/m²`);
    if (lastResults.cardiacOutput !== null) lvotLines.push(`CO: ${fmt(lastResults.cardiacOutput)} l/min`);
    if (lastResults.cardiacIndex !== null) lvotLines.push(`CI: ${fmt(lastResults.cardiacIndex)} l/min/m²`);
    blocks.push(lvotLines.length ? lvotLines.join("\n") : null);

    // AR PISA
    blocks.push(pisaLine(t, lang, t.arPisaGroup, t.arEro, t.arRegVol, t.arRegFraction,
      s.arPisaRadius, s.arVmax, s.arVti, s.arAliasingVelocity,
      lastResults.arEro, lastResults.arRegVol, lastResults.arRegFraction));

    // TR PISA — no regFraction (not calculated for TR)
    blocks.push(pisaLine(t, lang, t.trPisaGroup, t.trEro, t.trRegVol, null,
      s.trPisaRadius, s.trVmax, s.trVti, s.trAliasingVelocity,
      lastResults.trEro, lastResults.trRegVol, null));

    return blocks.filter(b => b !== null).join("\n\n");
  }

  function flashCopyButton(message) {
    const btn = $("#copyBtn");
    btn.textContent = message;
    clearTimeout(flashCopyButton._t);
    flashCopyButton._t = setTimeout(() => applyTranslations(), 1500);
  }

  function legacyCopy(text) {
    // execCommand fallback — needed because navigator.clipboard.writeText()
    // exists but unreliably rejects with a permission error specifically
    // inside iOS standalone home-screen PWAs (a known WebKit quirk); this
    // older API works there even when the modern one doesn't.
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  $("#copyBtn").addEventListener("click", async () => {
    const t = translations[state.language];
    const text = buildReportText();
    if (!text) {
      flashCopyButton(t.copyEmpty);
      return;
    }
    let ok = false;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        await navigator.clipboard.writeText(text);
        ok = true;
      } catch (e) { /* fall through to legacy fallback below */ }
    }
    if (!ok) ok = legacyCopy(text);
    flashCopyButton(ok ? t.copied : t.copyFailed);
  });

  applyTranslations();
  computeResults();
  refreshInfoLanguage();
  refreshWikiLanguage();
  // Cold load on a #wiki or #wiki/<id> URL should open straight to that
  // view instead of requiring the wiki button to be clicked first.
  syncWikiToHash();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body>
</html>
