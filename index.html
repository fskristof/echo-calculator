<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Echo Calculator</title>

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Echo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3B82F6">

<style>
  :root {
    --bg: #F5F7FA;
    --card: #FFFFFF;
    --subtle-bg: #F9FAFB;
    --input-bg: #F9FAFB;
    --input-border: #E5E7EB;
    --input-border-active: #007AFF;
    --input-border-error: #EF4444;
    --text-main: #1F2937;
    --text-sub: #6B7280;
    --text-placeholder: #9CA3AF;
    --accent: #3B82F6;
    --accent-text: #FFFFFF;
    --result-bg: #F0F9FF;
    --result-text: #1E40AF;
    --danger: #EF4444;
    --danger-text: #FFFFFF;
    --shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    --divider: #E5E7EB;
    --grade-mild-bg: #DCFCE7;
    --grade-mild-text: #166534;
    --grade-moderate-bg: #FEF3C7;
    --grade-moderate-text: #92400E;
    --grade-severe-bg: #FEE2E2;
    --grade-severe-text: #991B1B;
    --grade-extreme-bg: #7F1D1D;
    --grade-extreme-text: #FFFFFF;
  }

  /* Light is the default and always what a fresh visit sees — dark only applies
     when the user explicitly switches via the header toggle (persisted below). */
  html[data-theme="dark"] {
    --bg: #0F1420;
    --card: #171D2B;
    --subtle-bg: #1E2536;
    --input-bg: #1B2233;
    --input-border: #2C3548;
    --input-border-active: #4C9AFF;
    --input-border-error: #F87171;
    --text-main: #E7EAF2;
    --text-sub: #93A0B8;
    --text-placeholder: #5B6784;
    --accent: #3B82F6;
    --accent-text: #FFFFFF;
    --result-bg: #16233D;
    --result-text: #7FB2FF;
    --danger: #F87171;
    --danger-text: #1A0E0E;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    --divider: #26304A;
    --grade-mild-bg: #14351F;
    --grade-mild-text: #86EFAC;
    --grade-moderate-bg: #3B2A08;
    --grade-moderate-text: #FCD34D;
    --grade-severe-bg: #3F1414;
    --grade-severe-text: #FCA5A5;
    --grade-extreme-bg: #7F1D1D;
    --grade-extreme-text: #FFE4E6;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  .phone {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }

  header.appbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--divider);
    position: sticky;
    top: 0;
    z-index: 5;
  }

  header.appbar h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .lang-toggle {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    touch-action: manipulation;
    user-select: none;
  }
  .lang-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .theme-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    background: var(--subtle-bg);
    border: 1px solid var(--input-border);
    border-radius: 8px;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    color: var(--text-main);
  }
  .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .theme-toggle svg { width: 20px; height: 20px; }
  .theme-toggle .icon-moon { display: none; }
  html[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
  html[data-theme="dark"] .theme-toggle .icon-moon { display: block; }

  main {
    flex: 1;
    padding: 20px 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 12px;
    box-shadow: var(--shadow);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
    background: none;
    border: none;
    width: 100%;
    padding: 4px 0;
    font-family: inherit;
    color: var(--text-main);
  }
  .card-header:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  .card-header .title {
    font-size: 19px;
    font-weight: 600;
  }

  .chevron {
    width: 22px;
    height: 22px;
    color: var(--text-main);
    transition: transform 0.18s ease;
    flex-shrink: 0;
  }
  .card-header[aria-expanded="true"] .chevron { transform: rotate(180deg); }

  .card-body {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card-body[hidden] { display: none; }

  .subgroup {
    background: var(--subtle-bg);
    border-radius: 12px;
    padding: 8px 8px 4px;
    border: 1px solid var(--input-border);
  }
  .subgroup + .subgroup { margin-top: 12px; }
  .subgroup-title {
    font-size: 15px;
    font-weight: 600;
    margin: 4px 4px 12px;
  }
  .subgroup .field-stack { padding: 0 4px; display: flex; flex-direction: column; gap: 12px; }
  .subgroup .field-stack[hidden] { display: none; }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-sub);
    margin-bottom: 8px;
  }

  .field input {
    width: 100%;
    background: var(--input-bg);
    border: 2px solid var(--input-border);
    border-radius: 12px;
    padding: 13px 16px;
    font-size: 17px;
    color: var(--text-main);
    font-family: inherit;
    font-variant-numeric: tabular-nums;
    transition: border-color 0.12s ease;
  }
  .field input::placeholder { color: var(--text-placeholder); }
  .field input:not(:placeholder-shown) { border-color: var(--input-border-active); }
  .field input.error { border-color: var(--input-border-error) !important; }
  .field input:focus { outline: none; border-color: var(--input-border-active); }
  .field .decimal-error {
    color: var(--danger);
    font-size: 12px;
    margin-top: 4px;
  }

  .heart-rate-label {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-sub);
    margin: 4px 0 0;
  }

  .bsa-toggle {
    background: none;
    border: none;
    color: var(--input-border-active);
    font-size: 14px;
    font-weight: 500;
    padding: 6px 0;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    touch-action: manipulation;
    user-select: none;
  }
  .bsa-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Results */
  .results-title {
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 16px;
  }
  .result-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    column-gap: 10px;
    padding: 12px 16px;
    background: var(--result-bg);
    border-radius: 8px;
  }
  .result-row .label {
    font-size: 14px;
    font-weight: 500;
    color: var(--result-text);
    min-width: 0;
  }
  .result-row .value {
    font-size: 17px;
    font-weight: 700;
    color: var(--result-text);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    text-align: right;
  }

  .clear-btn {
    background: var(--danger);
    color: var(--danger-text);
    border: none;
    padding: 16px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    margin: 4px 0 8px;
    touch-action: manipulation;
    user-select: none;
  }
  .clear-btn:focus-visible { outline: 2px solid var(--danger); outline-offset: 2px; }

  footer.note {
    text-align: center;
    font-size: 12px;
    color: var(--text-sub);
    padding: 4px 20px 24px;
    line-height: 1.5;
  }

  /* Info ("i") buttons sit beside a heading. Where the heading is itself a
     collapse button, both live in .head-row so the two never nest. */
  .head-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .head-row > .card-header { flex: 1; min-width: 0; }

  .info-btn {
    flex-shrink: 0;
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    padding: 0;
    border-radius: 50%;
    border: none;
    background: none;
    color: var(--input-border-active);
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
  }
  .info-btn svg { width: 17px; height: 17px; }
  .info-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .subgroup-title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 4px 12px;
  }
  .subgroup-title-row .subgroup-title { margin: 0; }
  .head-row .info-btn { margin-left: 0; }

  /* Grade badges on results */
  .grade {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  .grade-mild { background: var(--grade-mild-bg); color: var(--grade-mild-text); }
  .grade-moderate { background: var(--grade-moderate-bg); color: var(--grade-moderate-text); }
  .grade-severe { background: var(--grade-severe-bg); color: var(--grade-severe-text); }
  .grade-massive, .grade-torrential { background: var(--grade-extreme-bg); color: var(--grade-extreme-text); }

  /* Full-screen info overlay */
  .info-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .info-overlay[hidden] { display: none; }

  .info-panel {
    width: 100%;
    max-width: 430px;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  .info-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--divider);
    flex-shrink: 0;
  }
  .info-bar h2 {
    font-size: 19px;
    font-weight: 700;
    margin: 0;
    flex: 1;
    min-width: 0;
  }
  .info-close {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    background: var(--subtle-bg);
    border: 1px solid var(--input-border);
    border-radius: 8px;
    color: var(--text-main);
    cursor: pointer;
    touch-action: manipulation;
  }
  .info-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .info-close svg { width: 20px; height: 20px; }

  .info-content {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 12px 32px;
  }

  .info-table-wrap {
    overflow-x: auto;
    background: var(--card);
    border-radius: 12px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  table.info-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  /* Tables with more columns than a phone screen can fit (e.g. TR's
     Massive/Torrential columns) use fixed column widths from a <colgroup>
     so Parameter + Mild/Moderate/Severe fit without scrolling, and only
     the trailing columns require a horizontal scroll to reach. The
     Parameter column stays pinned in place (sticky) while that happens. */
  table.info-table.wide {
    table-layout: fixed;
    border-collapse: separate;
    border-spacing: 0;
  }
  table.info-table.wide thead th {
    white-space: nowrap;
  }
  table.info-table.wide tbody th,
  table.info-table.wide tbody td {
    white-space: normal;
    overflow-wrap: break-word;
    hyphens: auto;
  }
  table.info-table.wide th:first-child,
  table.info-table.wide td:first-child {
    position: sticky;
    left: 0;
    z-index: 1;
    background: var(--card);
    box-shadow: 1px 0 0 var(--divider);
  }
  table.info-table.wide thead th:first-child { z-index: 2; }
  table.info-table.wide th,
  table.info-table.wide td {
    padding-left: 7px;
    padding-right: 7px;
  }
  table.info-table th,
  table.info-table td {
    padding: 10px 10px;
    text-align: left;
    vertical-align: top;
    border-bottom: 1px solid var(--divider);
  }
  table.info-table thead th {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-sub);
    white-space: nowrap;
  }
  table.info-table tbody th {
    font-weight: 600;
    color: var(--text-main);
  }
  table.info-table tbody td { color: var(--text-sub); font-variant-numeric: tabular-nums; }
  table.info-table tr:last-child th,
  table.info-table tr:last-child td { border-bottom: none; }
  table.info-table th.col-mild { color: var(--grade-mild-text); }
  table.info-table th.col-moderate { color: var(--grade-moderate-text); }
  table.info-table th.col-severe { color: var(--grade-severe-text); }
  table.info-table th.col-massive,
  table.info-table th.col-torrential { color: var(--grade-extreme-bg); }
  html[data-theme="dark"] table.info-table th.col-massive,
  html[data-theme="dark"] table.info-table th.col-torrential { color: var(--grade-extreme-text); }

  .info-notes {
    background: var(--card);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 16px;
  }
  .info-notes h3 {
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 10px;
  }
  .info-notes ul { margin: 0; padding-left: 18px; }
  .info-notes li {
    font-size: 13px;
    line-height: 1.55;
    color: var(--text-sub);
    margin-bottom: 8px;
  }
  .info-notes li:last-child { margin-bottom: 0; }
</style>
</head>
<body>
<div class="phone">
  <header class="appbar">
    <h1 id="title">Echo Calculator</h1>
    <div class="header-controls">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
      <button class="lang-toggle" id="langToggle" type="button">HU</button>
    </div>
  </header>

  <main id="main">

    <!-- Patient Data -->
    <section class="card" data-card="patient">
      <button class="card-header" type="button" aria-expanded="false">
        <span class="title" data-t="patientData">Patient Data</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="card-body" hidden>
        <button class="bsa-toggle" type="button" id="bsaModeToggle" data-t="bsaManual">Enter BSA manually</button>

        <div id="bsaAutoFields">
          <div class="field">
            <label data-t-unit="weight|kg">Weight (kg)</label>
            <input type="text" inputmode="decimal" placeholder="0" data-field="weight">
            <div class="decimal-error" hidden data-t="decimalError"></div>
          </div>
          <div class="field">
            <label data-t-unit="height|cm">Height (cm)</label>
            <input type="text" inputmode="decimal" placeholder="0" data-field="height">
            <div class="decimal-error" hidden data-t="decimalError"></div>
          </div>
        </div>

        <div id="bsaManualFields" hidden>
          <div class="field">
            <label data-t-unit="bsaResult|m²">BSA (m²)</label>
            <input type="text" inputmode="decimal" placeholder="0" data-field="bsaManual">
            <div class="decimal-error" hidden data-t="decimalError"></div>
          </div>
        </div>

        <p class="heart-rate-label" data-t="heartRateGroup">Heart Rate</p>
        <div class="field">
          <label data-t-unit="heartRate|bpm">Heart Rate (bpm)</label>
          <input type="text" inputmode="decimal" placeholder="0" data-field="heartRate">
          <div class="decimal-error" hidden data-t="decimalError"></div>
        </div>
      </div>
    </section>

    <!-- Mitral Valve -->
    <section class="card" data-card="mitral">
      <button class="card-header" type="button" aria-expanded="false">
        <span class="title" data-t="mitralValveGroup">Mitral Valve</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="card-body" hidden>
        <div class="subgroup">
          <div class="subgroup-title-row">
            <p class="subgroup-title" data-t="mrPisaGroup">MR PISA</p>
            <button class="info-btn" type="button" data-info="mr" aria-label="Mitral regurgitation severity reference"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"></circle><line x1="12" y1="11" x2="12" y2="16.5"></line><circle cx="12" cy="7.8" r="0.5" fill="currentColor" stroke="none"></circle></svg></button>
          </div>
          <div class="field-stack">
            <div class="field">
              <label data-t-unit="pisaRadius|mm">PISA radius (mm)</label>
              <input type="text" inputmode="decimal" placeholder="0" data-field="mrPisaRadius">
              <div class="decimal-error" hidden data-t="decimalError"></div>
            </div>
            <div class="field">
              <label data-t-unit="aliasingVelocity|cm/s">Aliasing velocity (cm/s)</label>
              <input type="text" inputmode="decimal" placeholder="0" data-field="mrAliasingVelocity">
              <div class="decimal-error" hidden data-t="decimalError"></div>
            </div>
            <div class="field">
              <label data-t-unit="vmax|m/s">Vmax (m/s)</label>
              <input type="text" inputmode="decimal" placeholder="0" data-field="mrVmax">
              <div class="decimal-error" hidden data-t="decimalError"></div>
            </div>
            <div class="field">
              <label data-t-unit="vti|cm">VTI (cm)</label>
              <input type="text" inputmode="decimal" placeholder="0" data-field="mrVti">
              <div class="decimal-error" hidden data-t="decimalError"></div>
            </div>
          </div>
        </div>

        <div class="subgroup">
          <div class="subgroup-title-row">
            <p class="subgroup-title" data-t="mvVtiPw">MV VTI (PW)</p>
            <button class="info-btn" type="button" data-info="mr" aria-label="Mitral regurgitation severity reference"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"></circle><line x1="12" y1="11" x2="12" y2="16.5"></line><circle cx="12" cy="7.8" r="0.5" fill="currentColor" stroke="none"></circle></svg></button>
          </div>
          <div class="field-stack">
            <div class="field">
              <label data-t-unit="|cm">(cm)</label>
              <input type="text" inputmode="decimal" placeholder="0" data-field="mvVtiPw">
              <div class="decimal-error" hidden data-t="decimalError"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Aortic Valve (main) -->
    <section class="card" data-card="aortic">
      <button class="card-header" type="button" aria-expanded="false">
        <span class="title" data-t="aorticValveMainGroup">Aortic Valve</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="card-body" hidden>

        <!-- LVOT subgroup -->
        <div class="subgroup" data-subcard="lvot">
          <button class="card-header" type="button" aria-expanded="false" style="margin:0;">
            <span class="title" style="font-size:16px;" data-t="lvotGroup">LVOT</span>

(function () {

      sv: "SV", svi: "SV(i)", cardiacOutput: "Perctérfogat", cardiacIndex: "Cardiac Index",
      ava: "AVA", avai: "AVAi", dviVti: "DVI(VTI)", dviVmax: "DVI(Vmax)", mvVtiLvotVti: "MV VTI / LVOT VTI",
      clear: "Összes törlése", results: "Számított eredmények",
      decimalError: "Kérjük, használja a ',' tizedeselválasztót",
    },
  };

  // ---- exact port of calculatorUtils.js ----
  const parseNumber = (value, lang) => {
    if (!value) return NaN;
    const normalized = lang === "hu" ? value.replace(",", ".") : value;
    return parseFloat(normalized);
  };
  const calculateBSA = (weight, height, manualMode, manualValue, lang) => {
    if (manualMode) {
      const m = parseNumber(manualValue, lang);
      return !isNaN(m) && m > 0 ? m : null;
    }
    const w = parseNumber(weight, lang), h = parseNumber(height, lang);
    if (weight && height && !isNaN(w) && !isNaN(h) && w > 0 && h > 0) return Math.sqrt((h * w) / 3600);
    return null;
  };
  const calculateEro = (pisaRadius, aliasing, vmax, lang) => {
    const r = parseNumber(pisaRadius, lang), a = parseNumber(aliasing, lang), v = parseNumber(vmax, lang);
    if (pisaRadius && aliasing && vmax && !isNaN(r) && !isNaN(a) && !isNaN(v) && r > 0 && a > 0 && v > 0) {
      return (2 * Math.PI * Math.pow(r / 10, 2) * a) / (v * 100);
    }
    return null;
  };
  const calculateRegVol = (ero, vti, lang) => {
    const v = parseNumber(vti, lang);
    if (ero !== null && vti && !isNaN(v) && v > 0) return ero * v;
    return null;
  };
  const calculateSV = (lvotDiam, lvotVti, lang) => {
    const d = parseNumber(lvotDiam, lang), v = parseNumber(lvotVti, lang);
    if (lvotDiam && lvotVti && !isNaN(d) && !isNaN(v) && d > 0 && v > 0) {
      return (Math.PI * Math.pow(d / 2, 2) * v) / 100;
    }
    return null;
  };
  const calculateRegFraction = (regVol, sv) => (regVol !== null && sv !== null && sv > 0) ? (regVol / (sv + regVol)) * 100 : null;
  const calculateARRegFraction = (arRegVol, sv) => (arRegVol !== null && sv !== null && sv > 0) ? (arRegVol / sv) * 100 : null;
  const calculateSVI = (sv, bsa) => (sv !== null && bsa !== null && bsa > 0) ? sv / bsa : null;
  const calculateCardiacOutput = (sv, heartRate, lang) => {
    const hr = parseNumber(heartRate, lang);
    if (sv !== null && heartRate && !isNaN(hr) && hr > 0) return (sv / 1000) * hr;
    return null;
  };
  const calculateCardiacIndex = (co, bsa) => (co !== null && bsa !== null && bsa > 0) ? co / bsa : null;
  const calculateAVA = (lvotDiam, lvotVti, aorticVti, lang) => {
    const d = parseNumber(lvotDiam, lang), lv = parseNumber(lvotVti, lang), av = parseNumber(aorticVti, lang);
    if (lvotDiam && lvotVti && aorticVti && !isNaN(d) && !isNaN(lv) && !isNaN(av) && d > 0 && lv > 0 && av > 0) {
      return (Math.pow(d / 2, 2) * Math.PI * lv) / av / 100;
    }
    return null;
  };
  const calculateAVAI = (ava, bsa) => (ava !== null && bsa !== null && bsa > 0) ? ava / bsa : null;
  const calculateDVIVti = (lvotVti, aorticVti, lang) => {
    const lv = parseNumber(lvotVti, lang), av = parseNumber(aorticVti, lang);
    if (lvotVti && aorticVti && !isNaN(lv) && !isNaN(av) && av > 0) return lv / av;
    return null;
  };
  const calculateDVIVmax = (lvotVmax, aorticVmax, lang) => {
    const lv = parseNumber(lvotVmax, lang), av = parseNumber(aorticVmax, lang);
    if (lvotVmax && aorticVmax && !isNaN(lv) && !isNaN(av) && av > 0) return lv / av;
    return null;
  };

  // ---- severity grading ----
  // English-only for now; grading bands transcribed from Echo checklist.xlsx.
  // Ambiguous range boundaries are resolved toward the higher-severity side.
  const gradeLabels = { mild: "Mild", moderate: "Moderate", severe: "Severe", massive: "Massive", torrential: "Torrential" };
  const gradeFns = {
    mrEro: v => v < 0.2 ? "mild" : v <= 0.4 ? "moderate" : "severe",
    mrRegVol: v => v < 30 ? "mild" : v < 60 ? "moderate" : "severe",
    mrRegFraction: v => v < 30 ? "mild" : v < 50 ? "moderate" : "severe",
    arEro: v => v < 0.1 ? "mild" : v < 0.3 ? "moderate" : "severe",
    arRegVol: v => v < 30 ? "mild" : v < 60 ? "moderate" : "severe",
    arRegFraction: v => v < 30 ? "mild" : v < 50 ? "moderate" : "severe",
    trEro: v => v < 0.2 ? "mild" : v < 0.4 ? "moderate" : v < 0.6 ? "severe" : v < 0.8 ? "massive" : "torrential",
    trRegVol: v => v < 30 ? "mild" : v < 45 ? "moderate" : v < 60 ? "severe" : v < 75 ? "massive" : "torrential",
    ava: v => v >= 1.5 ? "mild" : v > 1.0 ? "moderate" : "severe",
    avai: v => v > 0.85 ? "mild" : v > 0.6 ? "moderate" : "severe",
    dviVti: v => v > 0.5 ? "mild" : v >= 0.25 ? "moderate" : "severe",
    dviVmax: v => v > 0.5 ? "mild" : v >= 0.25 ? "moderate" : "severe",
    // Only a single cutoff is defined for this metric (per user direction):
    // below 1 reads as mild, at/above 1 reads as severe, moderate is unused.
    mvVtiLvotVti: v => v < 1 ? "mild" : "severe",
  };

  // ---- severity reference content (English only; Hungarian pass comes later) ----
  const severityInfo = {
    mr: {
      title: "Mitral Regurgitation",
      headers: ["Parameter", "Mild", "Moderate", "Severe"],
      rows: [
        ["Vena contracta (mm)", "<3.0", "3.0–6.9", "≥7.0"],
        ["PISA radius (mm)", "<4", "4–10", ">10"],
        ["EROA (cm²)", "<0.2", "0.2–0.4", ">0.4"],
        ["Reg. vol. (ml)", "<30", "30–59", "≥60"],
        ["Reg. fraction (%)", "<30", "30–49", "≥50"],
        ["3D VCA (cm²)", "—", "—", "≥0.5"],

        ["Jet / LVOT diameter", "<0.25", "0.25–0.64", ">0.64"],

      rows: [

        ["PISA radius (mm)", "<5", "6–9", ">9", "", ""],
        ["EROA (cm²)", "<0.2", "0.2–0.39", "0.4–0.59", "0.6–0.79", "≥0.8"],
        ["Reg. vol. (ml)", "<30", "30–44", "45–59", "60–74", "≥75"],
        ["Hepatic vein flow", "S dominant (normal)", "S “blunting”", { text: "Systolic reverse flow", span: 3 }],
        ["Color jet", "Small, central", "Moderate", { text: "Large, central/eccentric", span: 3 }],

        ["CW shape", "Parabolic", "Parabolic", "Triangular", "", ""],
        ["3D VCA (cm²)", "<0.43", "0.43–0.67", "0.67–0.94", "0.95–1.14", ">1.14"],
        ["Jet area (cm²)", "<5", "5–10", ">10", "", ""],
      ],
      notes: [
        "Vena contracta should be averaged across several views.",
        "CW shape/density are not always reliable; if Vmax < 2 m/s, likely massive.",
      ],
    },
    as: {
      title: "Aortic Stenosis",
      headers: ["Parameter", "Mild", "Moderate", "Severe"],
      rows: [
        ["Vmax (m/s)", "2.6–2.9", "3–3.9", "≥4"],
        ["Mean gradient (mmHg)", "<20", "20–40", ">40"],
        ["AVA (cm²)", "≥1.5", "1.5–1.0", "≤1.0"],

  function renderInfo(topicKey) {
    const info = severityInfo[topicKey];
    if (!info) return;
    $("#infoTitle").textContent = info.title;
    const colClasses = ["", "col-mild", "col-moderate", "col-severe", "col-massive", "col-torrential"];
    const theadCells = info.headers.map((h, i) => {
      const cls = colClasses[i] || "";
      return `<th${cls ? ` class="${cls}"` : ""}>${h}</th>`;
    }).join("");
    const bodyRows = info.rows.map(r => {
      const [label, ...cells] = r;
      const tds = cells.map(c => {
        if (c && typeof c === "object") return `<td colspan="${c.span}">${c.text}</td>`;
        return `<td>${c}</td>`;
      }).join("");
      return `<tr><th scope="row">${label}</th>${tds}</tr>`;
    }).join("");

      ? `<colgroup>${info.colWidths.map(w => `<col style="width:${w}">`).join("")}</colgroup>`
      : "";

    // unbreakable content in some browsers, ignoring the colgroup — so the
    // table width has to be pinned explicitly to the sum of the columns.
    const tableWidthPx = info.colWidths
      ? info.colWidths.reduce((sum, w) => sum + parseFloat(w), 0)
      : null;
    const notesHtml = info.notes && info.notes.length
      ? `<div class="info-notes"><h3>Notes</h3><ul>${info.notes.map(n => `<li>${n}</li>`).join("")}</ul></div>`

    $("#infoContent").innerHTML = `
      <div class="info-table-wrap">
        <table class="info-table${info.wide ? " wide" : ""}"${tableWidthPx ? ` style="width:${tableWidthPx}px"` : ""}>
          ${colgroup}
          <thead><tr>${theadCells}</tr></thead>
          <tbody>${bodyRows}</tbody>
        </table>
      </div>
      ${notesHtml}
    `;
  }

  function openInfo(topicKey) {
    renderInfo(topicKey);
    $("#infoOverlay").hidden = false;
  }
  function closeInfo() {
    $("#infoOverlay").hidden = true;
  }

  // ---- state ----
  const state = { language: "hu", bsaManualMode: false };
  const fieldNames = [
    "weight","height","bsaManual","heartRate",
    "mrPisaRadius","mrAliasingVelocity","mrVmax","mrVti","mvVtiPw",
    "arPisaRadius","arAliasingVelocity","arVmax","arVti",
    "trPisaRadius","trAliasingVelocity","trVmax","trVti",
    "lvotDiam","lvotVti","lvotVmax","aorticVmax","meanGradient","aorticVti"
  ];
  fieldNames.forEach(f => state[f] = "");

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  // ---- theme (light is always the default for a first visit; a manual
  // choice is remembered locally so it persists between launches) ----
  let theme = "light";
  try {
    if (localStorage.getItem("echo-theme") === "dark") theme = "dark";
  } catch (e) { /* localStorage unavailable (e.g. private mode) — fall back to light */ }

  function applyTheme() {
    if (theme === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
  }
  applyTheme();

  function applyTranslations() {
    const t = translations[state.language];
    document.documentElement.lang = state.language;
    $$("[data-t]").forEach(el => {
      const key = el.getAttribute("data-t");
      if (t[key] !== undefined) el.textContent = t[key];
    });
    $$("[data-t-unit]").forEach(el => {
      const [key, unit] = el.getAttribute("data-t-unit").split("|");
      const label = key ? t[key] : "";
      el.textContent = unit ? `${label} (${unit})`.trim() : label;
    });
    $("#bsaModeToggle").textContent = state.bsaManualMode ? t.bsaCalculate : t.bsaManual;
    $("#langToggle").textContent = state.language === "en" ? "HU" : "EN";
    document.title = t.title;
  }

  function checkDecimal(input) {
    const value = input.value;
    const wrong = (state.language === "en" && value.includes(",")) || (state.language === "hu" && value.includes("."));
    const errEl = input.parentElement.querySelector(".decimal-error");
    input.classList.toggle("error", wrong);
    if (errEl) errEl.hidden = !wrong;
  }

  $$("input[data-field]").forEach(input => {
    input.addEventListener("input", () => {
      const key = input.dataset.field === "bsaManual" ? "bsaManualValue" : input.dataset.field;
      state[key] = input.value;
      checkDecimal(input);
      computeResults();
    });
  });

  $$(".card-header").forEach(btn => {
    btn.addEventListener("click", () => {
      const expanded = btn.getAttribute("aria-expanded") === "true";
      btn.setAttribute("aria-expanded", String(!expanded));
      const body = btn.nextElementSibling;
      body.hidden = expanded;
    });
  });

  $("#bsaModeToggle").addEventListener("click", () => {
    state.bsaManualMode = !state.bsaManualMode;
    $("#bsaAutoFields").hidden = state.bsaManualMode;
    $("#bsaManualFields").hidden = !state.bsaManualMode;
    applyTranslations();
    computeResults();
  });

  $("#langToggle").addEventListener("click", () => {
    state.language = state.language === "en" ? "hu" : "en";
    applyTranslations();
    $$("input[data-field]").forEach(checkDecimal);
    computeResults();
  });

  $("#themeToggle").addEventListener("click", () => {
    theme = theme === "dark" ? "light" : "dark";
    applyTheme();
    try { localStorage.setItem("echo-theme", theme); } catch (e) { /* ignore */ }
  });

  $$(".info-btn").forEach(btn => {
    btn.addEventListener("click", () => openInfo(btn.dataset.info));
  });
  $("#infoClose").addEventListener("click", closeInfo);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !$("#infoOverlay").hidden) closeInfo();
  });

  $("#clearBtn").addEventListener("click", () => {
    fieldNames.forEach(f => state[f] = "");
    state.bsaManualValue = "";
    $$("input[data-field]").forEach(i => { i.value = ""; i.classList.remove("error"); });
    $$(".decimal-error").forEach(e => e.hidden = true);
    computeResults();
  });

  function fmt(value) {
    if (value === null || value === undefined || isNaN(value)) return null;
    return state.language === "hu" ? value.toFixed(2).replace(".", ",") : value.toFixed(2);
  }

  function computeResults() {
    const s = state, lang = s.language;
    const bsa = calculateBSA(s.weight, s.height, s.bsaManualMode, s.bsaManualValue, lang);
    const mrEro = calculateEro(s.mrPisaRadius, s.mrAliasingVelocity, s.mrVmax, lang);
    const mrRegVol = calculateRegVol(mrEro, s.mrVti, lang);
    const sv = calculateSV(s.lvotDiam, s.lvotVti, lang);
    const mrRegFraction = calculateRegFraction(mrRegVol, sv);
    const arEro = calculateEro(s.arPisaRadius, s.arAliasingVelocity, s.arVmax, lang);
    const arRegVol = calculateRegVol(arEro, s.arVti, lang);
    const arRegFraction = calculateARRegFraction(arRegVol, sv);
    const trEro = calculateEro(s.trPisaRadius, s.trAliasingVelocity, s.trVmax, lang);
    const trRegVol = calculateRegVol(trEro, s.trVti, lang);
    const svi = calculateSVI(sv, bsa);
    const cardiacOutput = calculateCardiacOutput(sv, s.heartRate, lang);
    const cardiacIndex = calculateCardiacIndex(cardiacOutput, bsa);
    const ava = calculateAVA(s.lvotDiam, s.lvotVti, s.aorticVti, lang);
    const avai = calculateAVAI(ava, bsa);
    const dviVti = calculateDVIVti(s.lvotVti, s.aorticVti, lang);
    const dviVmax = calculateDVIVmax(s.lvotVmax, s.aorticVmax, lang);
    let mvVtiLvotVti = null;
    if (s.mvVtiPw && s.lvotVti) {
      const r = parseFloat(s.mvVtiPw) / parseFloat(s.lvotVti);
      if (!isNaN(r)) mvVtiLvotVti = r.toFixed(2);
    }

    const t = translations[lang];
    const rows = [
      ["bsaResult", bsa, "m²"],
      ["mrEro", mrEro, "cm²"],
      ["mrRegVol", mrRegVol, "ml"],
      ["mrRegFraction", mrRegFraction, "%"],
      ["arEro", arEro, "cm²"],
      ["arRegVol", arRegVol, "ml"],
      ["arRegFraction", arRegFraction, "%"],
      ["trEro", trEro, "cm²"],
      ["trRegVol", trRegVol, "ml"],
      ["ava", ava, "cm²"],
      ["avai", avai, "cm²/m²"],
      ["dviVti", dviVti, ""],
      ["dviVmax", dviVmax, ""],
      ["mvVtiLvotVti", mvVtiLvotVti === null ? null : parseFloat(mvVtiLvotVti.replace(",", ".")), ""],
      ["sv", sv, "ml"],
      ["svi", svi, "ml/m²"],
      ["cardiacOutput", cardiacOutput, "l/min"],
      ["cardiacIndex", cardiacIndex, "l/min/m²"],
    ];

    const list = $("#resultsList");
    list.innerHTML = "";
    let any = false;
    rows.forEach(([key, val, unit]) => {
      if (val === null || val === undefined || (typeof val === "number" && isNaN(val))) return;
      any = true;
      const row = document.createElement("div");
      row.className = "result-row";
      const numeric = typeof val === "number" ? val : parseFloat(val);
      const formatted = fmt(numeric);
      const gradeFn = gradeFns[key];
      const grade = gradeFn ? gradeFn(numeric) : null;
      const badge = grade ? `<span class="grade grade-${grade}">${gradeLabels[grade]}</span>` : "<span></span>";
      row.innerHTML = `<span class="label">${t[key]}</span>${badge}<span class="value">${formatted}${unit ? " " + unit : ""}</span>`;
      list.appendChild(row);
    });
    $("#resultsCard").hidden = !any;
  }

  applyTranslations();
  computeResults();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body>
</html>
